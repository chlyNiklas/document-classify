[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classify-service"
version = "0.1.0"
description = "API for explainable, human-reviewed document classification on KOBY"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["koby_classify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

