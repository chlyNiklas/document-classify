fault.            */\n.ob-prose h1 { font-size: var(--ob-size-4xl); line-height: var(--ob-lh-3xl); }\n.ob-prose h2 { font-size: var(--ob-size-3xl); line-height: var(--ob-lh-2xl); }\n.ob-prose h3 { font-size: var(--ob-size-2xl); line-height: var(--ob-lh-xl); }\n.ob-prose h4 { font-size: var(--ob-size-xl);  line-height: var(--ob-lh-lg); }\n.ob-prose p,\n.ob-prose li { font-size: var(--ob-size-lg); line-height: var(--ob-lh-lg); max-width: 68ch; }\n.ob-prose ul, .ob-prose ol { padding-left: 1.4em; }\n.ob-prose li + li { margin-top: var(--ob-space-2); }\n\n.ob-highlight-text { font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }\n\n.ob-screen-reader-only {\n\tposition: absolute !important;\n\twidth: 1px; height: 1px;\n\tpadding: 0; margin: -1px;\n\toverflow: hidden; clip: rect(0, 0, 0, 0);\n\twhite-space: nowrap; border: 0;\n}\n\n/* Definition list with side-by-side term/description from md up.              */\ndl.ob-horizontal { margin: 0 0 var(--ob-space-4); }\n@media (min-width: 906px) {\n\tdl.ob-horizontal { display: grid; grid-template-columns: max-content 1fr; column-gap: var(--ob-space-6); row-gap: var(--ob-space-2); }\n\tdl.ob-horizontal dt { grid-column: 1; }\n\tdl.ob-horizontal dd { grid-column: 2; margin: 0; }\n}\n\n/* --------------------------------------------------------- Overlay helper -- */\n.ob-has-overlay { position: relative; }\n.ob-has-overlay .ob-overlay {\n\tposition: absolute; inset: 0; z-index: 10;\n\tpadding: 15px; text-align: center; color: var(--fg-1);\n\tbackground-color: rgb(255 255 255 / 0.8);\n\topacity: 0; transition: opacity var(--ob-duration-micro) ease-in;\n}\n.ob-has-overlay .ob-overlay.ob-overlay-fixed { position: fixed; z-index: var(--ob-z-modal); }\n.ob-has-overlay .ob-overlay.ob-overlay-in { opacity: 1; }\n\n/* --------------------------------------------------------- Popover content -- */\n.ob-popover-content {\n\tpadding: var(--ob-space-4) 0 var(--ob-space-4) var(--ob-space-4);\n\tmax-width: 40%;\n\tbackground: var(--surface-raised);\n\tz-index: var(--ob-z-tooltip);\n\tfilter: drop-shadow(0 2px 4px rgb(0 0 0 / 0.06)) drop-shadow(0 4px 10px rgb(0 0 0 / 0.08));\n}\n.ob-popover-content .ob-popover-content-wrapper {\n\toverflow-y: auto; padding-right: var(--ob-space-4); padding-bottom: var(--ob-space-2); max-height: 50vh;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Oblique Design System — root stylesheet\n   Swiss Confederation · Federal Office of Information Technology (FOITT)\n\n   Single entry point for consumers: link THIS file and you get the full\n   foundation in the correct cascade order.\n\n       <link rel=\"stylesheet\" href=\"styles.css\" />\n\n   1. colors_and_type.css — @font-face, design tokens (--ob-*), semantic\n      aliases (--fg-*, --surface*, --link…), dark-mode theme, type + icon helper.\n   2. utilities.css       — the .ob-* utility layer (grid, flex, forms, tables,\n      prose, a11y, overlay/popover helpers). Depends on the tokens above.\n   3. obx-core.css        — OBLIQUE NEXT tokens: 8px geometry, layered shadows,\n      glass, gradients, motion, new type voice (--obx-*).\n   4. obx-components.css  — OBLIQUE NEXT component layer (.obx-*): buttons,\n      forms, badges, cards, alerts, toasts, dialog, table, tabs, stepper,\n      topbar+sidebar shell, command palette, skeleton, empty state.\n\n   Component/preview stylesheets (preview/card.css, ui_kits/federal-app/kit.css)\n   are scoped to their own surfaces and import colors_and_type.css themselves —\n   they are intentionally NOT bundled here.\n   ============================================================================ */\n\n/* ============================================================================\n   Oblique Design System — Colours & Type\n   Swiss Confederation · Federal Office of Information Technology (FOITT)\n   Values mirror the Oblique design tokens (Figma → CSS, 1:1).\n   Source: github.com/oblique-bit/oblique  ·  oblique.bit.admin.ch\n   ============================================================================ */\n\n/* ----------------------------------------------------------------- Fonts -- */\n/* Self-hosted brand faces. The woff2 files ARE Google's Noto Sans (variable, real\n   weight axis 100–900) and Noto Sans Mono — the Oblique design system ships them\n   as its own typeface, aliased here under a project-scoped family name. */\n@font-face {\n\tfont-family: \"Oblique Sans\";\n\tfont-style: normal;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"9749cd95-b8b5-4a68-9c9d-3669ebd27fe4\") format(\"woff2\");\n}\n@font-face {\n\tfont-family: \"Oblique Sans\";\n\tfont-style: italic;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"830c6198-516c-4976-a7e9-2bad7255e7f1\") format(\"woff2\");\n}\n@font-face {\n\tfont-family: \"Oblique Mono\";\n\tfont-style: normal;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"b728b1b2-0662-4a8e-b691-c276cb30a3ad\") format(\"woff2\");\n}\n\n:root {\n\t/* === RAW OBLIQUE TOKENS (curated subset, light mode / inversity-normal) === */\n\n\t/* — Neutral scale (cool slate-blue greys) — */\n\t--ob-neutral-0:    #ffffff;  /* surface / contrast-highest bg            */\n\t--ob-neutral-50:   #f0f4f7;  /* subtle bg, hover fill (contrast-high)    */\n\t--ob-neutral-100:  #dfe4e9;  /* muted bg, dividers (contrast-medium)     */\n\t--ob-neutral-200:  #acb4bd;  /* borders, disabled (contrast-low)         */\n\t--ob-neutral-300:  #828e9a;  /* placeholder, icons-muted                 */\n\t--ob-neutral-400:  #596978;  /* secondary icon / filled-neutral surface  */\n\t--ob-neutral-500:  #46596b;\n\t--ob-neutral-600:  #2f4356;  /* secondary text (fg contrast-low)         */\n\t--ob-neutral-700:  #263645;  /* strong text (fg contrast-medium)         */\n\t--ob-neutral-800:  #1c2834;  /* primary text (fg contrast-high)          */\n\t--ob-neutral-900:  #131b22;  /* near-black (fg contrast-highest)         */\n\n\t/* — Brand: Swiss federal red — */\n\t/* NB (provenance): the \"Project Starter Kit 15.1.2\" Figma file still carries the LEGACY\n\t   variable set (--blue-700 #1d4ed8 links, slate --secondary-400 #596978 buttons, green\n\t   success). This file follows the RELEASED design-system tokens (15.1.2/15.2.0), which\n\t   define the current steel-blue interaction palette. Legacy set kept for reference in\n\t   scraps/fig-starter-tokens/fig-tokens.css. */\n\t--ob-brand:        #ff0000;  /* the pure-red coat-of-arms / cross         */\n\t--ob-red-700:      #99191e;  /* critical fg / dark federal red            */\n\t--ob-red-600:      #bf1f25;\n\t--ob-red-500:      #d8232a;  /* critical accent (bright)                  */\n\t--ob-red-50:       #ffedee;  /* critical surface                          */\n\t--ob-red-100:      #ffccce;\n\n\t/* — Interaction (links, selection): the Oblique STEEL BLUE.\n\t     Verified 06.2026 against the released design-system tokens (15.1.2 + 15.2.0,\n\t     `--ob-s3-color-interaction-state-*`). NB: the Tailwind blue #1D4ED8 seen in a few\n\t     Figma component fills is the *status-info* palette / a stale fill — NOT the link colour. — */\n\t--ob-interaction-fg:        #2e8fbf;  /* link & enabled/focus fg (s3 fg-enabled)     */\n\t--ob-interaction-hover:     #236487;  /* hover fg                                    */\n\t--ob-interaction-pressed:   #236487;  /* pressed fg (= hover in 15.x)                */\n\t--ob-interaction-visited:   #4338ca;  /* visited link (indigo)                       */\n\t--ob-interaction-bg:        #2379a4;  /* primary-action surface (s3 bg-enabled)      */\n\t--ob-interaction-selected-bg: #aacae6; /* selected surface                           */\n\t--ob-interaction-focus-bg:  #d3dee9;  /* focussed surface                            */\n\t--ob-interaction-disabled-fg: rgb(19 27 34 / 0.4);\n\t--ob-interaction-disabled-bg: rgb(19 27 34 / 0.1);\n\t--ob-focus-ring:            #8b5cf6;  /* 3px solid violet focus outline, 3px offset  */\n\n\t/* — Buttons (`--ob-h-button-*` tokens 15.x): primary = FILLED STEEL BLUE;\n\t     secondary = transparent + 1px border in the link colour; tertiary = bare label.\n\t     Label 500 16px/16px · radius 1px · hover lifts (shadow-xl) · pressed flat. — */\n\t--ob-btn-primary-bg:        #2379a4;  /* s3 interaction bg-enabled (flipped)  */\n\t--ob-btn-primary-hover:     #236487;\n\t--ob-btn-primary-pressed:   #255069;\n\t--ob-btn-primary-fg:        #ffffff;\n\t--ob-btn-outline:           #2e8fbf;  /* secondary border (hover → #236487)   */\n\t--ob-btn-ink:               #2e8fbf;  /* secondary / tertiary label            */\n\t--ob-btn-ink-hover:         #236487;\n\t--ob-btn-ghost-hover:       #ffffff;  /* sec./tert. hover fill — white on the grey canvas */\n\t--ob-btn-disabled-bg:       rgb(19 27 34 / 0.3);  /* primary disabled */\n\t--ob-btn-disabled-fg:       rgb(19 27 34 / 0.4);\n\t--ob-btn-radius:            1px; /* @kind radius */      /* h-button border_radius = radius-sm */\n\n\t/* — Status palette — the 12 Oblique statuses (s3 status tokens, light mode).\n\t     -fg = fg-contrast_high (text) · -500 = fg-contrast_low (accent/icon) · -50 = bg-contrast_high (surface).\n\t     Pale border tint = bg-contrast_medium; strong tint = bg-contrast_low. — */\n\t--ob-info-fg:      #1e3a8a;  --ob-info-500:      #1d4ed8;  --ob-info-50:      #eff6ff; /* blue    */\n\t--ob-confirmed-fg: #11575f;  --ob-confirmed-500: #0d8b96;  --ob-confirmed-50: #f2fdfc; /* TEAL    */\n\t--ob-resolved-fg:  #065f46;  --ob-resolved-500:  #059669;  --ob-resolved-50:  #ecfdf5; /* green   */\n\t--ob-attention-fg: #9a3412;  --ob-attention-500: #ea580c;  --ob-attention-50: #fff7ed; /* orange  */\n\t--ob-pending-fg:   #92400e;  --ob-pending-500:   #d97706;  --ob-pending-50:   #fffbeb; /* amber   */\n\t--ob-critical-fg:  #99191e;  --ob-critical-500:  #d8232a;  --ob-critical-50:  #ffedee; /* red     */\n\t--ob-fatal-fg:     #99191e;  --ob-fatal-500:     #d8232a;  --ob-fatal-50:     #ffedee; /* red (darker ramp on dark) */\n\t--ob-progress-fg:  #3730a3;  --ob-progress-500:  #4f46e5;  --ob-progress-50:  #eef2ff; /* indigo  */\n\t--ob-waiting-fg:   #5b21b6;  --ob-waiting-500:   #7c3aed;  --ob-waiting-50:   #f5f3ff; /* violet  */\n\t--ob-scheduled-fg: #9d174d;  --ob-scheduled-500: #db2777;  --ob-scheduled-50: #fdf2f8; /* pink    */\n\t--ob-closed-fg:    #131b22;  --ob-closed-500:    #263645;  --ob-closed-50:    #f0f4f7; /* neutral */\n\t--ob-disabled-fg:  #131b22;  --ob-disabled-500:  #263645;  --ob-disabled-50:  #f0f4f7; /* neutral */\n\t/* Back-compat aliases (pre-15 naming used in earlier drafts of this kit) */\n\t--ob-success-fg: var(--ob-confirmed-fg); --ob-success-500: var(--ob-confirmed-500); --ob-success-50: var(--ob-confirmed-50);\n\t--ob-warning-fg: var(--ob-pending-fg);   --ob-warning-500: var(--ob-pending-500);   --ob-warning-50: var(--ob-pending-50);\n\n\t/* — Type families — */\n\t--ob-font-body:    \"Oblique Sans\", system-ui, -apple-system, \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n\t--ob-font-heading: var(--ob-font-body);\n\t--ob-font-mono:    \"Oblique Mono\", ui-monospace, sfmono-regular, consolas, \"Liberation Mono\", menlo, monospace;\n\n\t/* — Font sizes (static scale, rem) — */\n\t--ob-size-xs:   0.75rem;    /* 12 */\n\t--ob-size-sm:   0.875rem;   /* 14 */\n\t--ob-size-md:   1rem;       /* 16 — base */\n\t--ob-size-lg:   1.125rem;   /* 18 */\n\t--ob-size-xl:   1.4375rem;  /* 23 */\n\t--ob-size-2xl:  1.75rem;    /* 28 */\n\t--ob-size-3xl:  2.125rem;   /* 34 */\n\t--ob-size-4xl:  2.5rem;     /* 40 */\n\t--ob-size-5xl:  3rem;       /* 48 */\n\n\t/* — Weights — */\n\t--ob-weight-regular: 400;\n\t--ob-weight-medium:  500;\n\t--ob-weight-semibold:600;\n\t--ob-weight-bold:    700;\n\t--ob-weight-extrabold:800;\n\n\t/* — Line heights — */\n\t--ob-lh-xs: 1rem;    --ob-lh-sm: 1.25rem;  --ob-lh-md: 1.5rem;\n\t--ob-lh-lg: 1.75rem; --ob-lh-xl: 2.25rem;  --ob-lh-2xl: 3rem; --ob-lh-3xl: 3.5rem;\n\n\t/* — Letter spacing (typographic tracking; @kind other so it stays out of the spacing scale) — */\n\t--ob-ls-narrower:     -1px;   /* @kind other */\n\t--ob-ls-super-narrow: -1.5px; /* @kind other */\n\t--ob-ls-narrow:       -0.5px; /* @kind other */\n\t--ob-ls-normal:        0;     /* @kind other */\n\t--ob-ls-wide:          0.5px; /* @kind other */\n\n\t/* — Radii (federal design = very sharp corners) — */\n\t--ob-radius-sm: 1px;   /* BUTTONS — h-button-border_radius (= radius-sm)            */\n\t--ob-radius-md: 2px;   /* button focus-ring radius                                   */\n\t--ob-radius-lg: 4px;   /* base radius: inputs, cards, datepicker, alerts             */\n\t--ob-radius-pill: 999px; /* avatars, pills, icon-button focus ring                   */\n\n\t/* — Border widths — */\n\t--ob-border-xs: 1px;  --ob-border-sm: 2px;  --ob-border-md: 3px;  --ob-border-lg: 4px;\n\n\t/* — Spacing scale (px) — */\n\t--ob-space-1: 4px;   --ob-space-2: 8px;   --ob-space-3: 12px;  --ob-space-4: 16px;\n\t--ob-space-5: 20px;  --ob-space-6: 24px;  --ob-space-7: 28px;  --ob-space-8: 32px;\n\t--ob-space-9: 36px;  --ob-space-10: 40px; --ob-space-12: 48px; --ob-space-14: 56px; --ob-space-16: 64px;\n\t/* Named spacing aliases — mirror Oblique's $ob-spacing-* SCSS scale (same px, semantic names) */\n\t--ob-space-xs: 4px;   --ob-space-sm: 8px;       --ob-space-md: 12px;  --ob-space-default: 16px;\n\t--ob-space-lg: 24px;  --ob-space-xl: 32px;      --ob-space-xxl: 48px;\n\n\t/* — Elevation (`--ob-s-shadow-*`): always two layers, NAVY-tinted\n\t     rgb(19 27 34) = #131b22 at 5% + 10% — never pure black. — */\n\t--ob-shadow-sm:      0 1px 2px 0 rgb(19 27 34 / 0.05);\n\t--ob-shadow-md:      0 1px 2px 0 rgb(19 27 34 / 0.05), 0 1px 5px 0 rgb(19 27 34 / 0.1);\n\t--ob-shadow-default: 0 2px 4px -1px rgb(19 27 34 / 0.05), 0 4px 10px -1px rgb(19 27 34 / 0.1);\n\t--ob-shadow-lg:      0 2px 6px -1px rgb(19 27 34 / 0.05), 0 5px 20px -2px rgb(19 27 34 / 0.1);\n\t--ob-shadow-xl:      0 6px 10px -5px rgb(19 27 34 / 0.05), 0 15px 25px -3px rgb(19 27 34 / 0.1);\n\t--ob-shadow-2xl:     1px 10px 70px -8px rgb(19 27 34 / 0.05), 0 10px 20px 0 rgb(19 27 34 / 0.1);\n\t--ob-shadow-nav-active: var(--ob-shadow-2xl);  /* s-shadow-main_nav-active */\n\n\t/* — Motion — authoritative Figma scale (--ob-s-motion-*). Reconciled 06.2026:\n\t   the legacy Angular SCSS used a single 0.6s/0.25s pair; the design-system\n\t   tokens define a 5-step duration scale + four named easings. */\n\t--ob-duration-instant:     0ms;    /* @kind other */\n\t--ob-duration-micro:       100ms;  /* @kind other */ /* links, tiny state changes */\n\t--ob-duration-smooth:      200ms;  /* @kind other */ /* buttons, default control motion */\n\t--ob-duration-comfortable: 300ms;  /* @kind other */\n\t--ob-duration-relaxed:     500ms;  /* @kind other */\n\t--ob-duration: var(--ob-duration-smooth);  /* back-compat alias (was 160ms) — @kind other */\n\t--ob-ease-standard: cubic-bezier(0, 0, 0.2, 1);   /* @kind other */\n\t--ob-ease-entrance: cubic-bezier(0, 0, 0.2, 1);   /* @kind other */\n\t--ob-ease-emphasis: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n\t--ob-ease-exit:     cubic-bezier(0.4, 0, 1, 1);   /* @kind other */\n\t--ob-outline-offset: 3px;          /* focus-ring outline-offset (s-outline_offset-md) — @kind other */\n\n\t/* === LAYOUT & SYSTEM TOKENS (added 06.2026 from the Oblique skill) ======== */\n\n\t/* — Z-index ladder — authoritative Figma scale (--ob-s-z_index-*).\n\t   NB: supersedes the legacy SCSS ladder (0/10/101/200/1005/1010/1020). */\n\t--ob-z-stepper-mobile: 1000;  /* @kind other */\n\t--ob-z-header:         1100;  /* @kind other */\n\t--ob-z-drawer:         1200;  /* @kind other */ /* off-canvas / sidenav */\n\t--ob-z-modal:          1300;  /* @kind other */\n\t--ob-z-notification:   1400;  /* @kind other */\n\t--ob-z-tooltip:        1500;  /* @kind other */\n\n\t/* — Breakpoints — federal grid tiers (xs/sm/md/lg). For reference + JS;\n\t   CSS @media can't read custom properties, so mirror these in media queries. */\n\t--ob-bp-xs: 0px;\n\t--ob-bp-sm: 601px;\n\t--ob-bp-md: 906px;\n\t--ob-bp-lg: 1241px;\n\n\t/* — Layout dimensions — fixed federal-chrome measures. */\n\t--ob-layout-body-width:        248px;  /* main-nav body column            */\n\t--ob-layout-logo-width:        218px;  /* Confederation lockup            */\n\t--ob-layout-logo-height:       53px;\n\t--ob-layout-line-width:        5px;    /* active-nav / accent indicator   */\n\t--ob-control-height:           36px;   /* button & input height           */\n\t--ob-offcanvas-width:          40%;\n\t--ob-offcanvas-width-collapsed: 80%;\n\n\t/* — Environment-banner colours — DEV/REF/TEST/ABN header banner.\n\t   Sourced from the Angular library palette (not in the Figma token set);\n\t   each takes white foreground (--ob-env-fg). */\n\t--ob-env-local: #047857;  /* local   — green  */\n\t--ob-env-dev:   #ca8a04;  /* dev     — yellow */\n\t--ob-env-ref:   #ea580c;  /* ref     — orange */\n\t--ob-env-test:  #46596b;  /* test    — slate  */\n\t--ob-env-abn:   #99191e;  /* abnahme — red    */\n\t--ob-env-fg:    #ffffff;\n\n\t/* === SEMANTIC ALIASES (use these in app code; they flip in dark mode) ==== */\n\t--fg-1: var(--ob-neutral-800);   /* primary body / UI text (fg contrast-high)   */\n\t--fg-2: var(--ob-neutral-600);   /* secondary text (fg contrast-low #2f4356)    */\n\t--fg-3: rgb(19 27 34 / 0.4);     /* muted / placeholder (fg contrast-lowest)    */\n\t--fg-on-dark: var(--ob-neutral-0);\n\n\t--surface:        var(--ob-neutral-0);   /* cards, header, inputs            */\n\t--surface-sunken: var(--ob-neutral-50);  /* app / page background            */\n\t--surface-raised: var(--ob-neutral-0);   /* menus, dialogs, popovers         */\n\t--surface-hover:  var(--ob-neutral-50);  /* row / control hover fill         */\n\n\t--bg:        var(--ob-neutral-0);    /* alias of --surface                 */\n\t--bg-subtle: var(--ob-neutral-50);\n\t--bg-muted:  var(--ob-neutral-100);\n\t--bg-header: var(--ob-neutral-0);    /* white app header                   */\n\t--bg-footer: #263645;                /* footer bar — secondary-700, official master-layout footer fill */\n\n\t--border:        var(--ob-neutral-200);\n\t--border-subtle: var(--ob-neutral-100);\n\t--border-strong: var(--ob-neutral-600);\n\n\t--link:         var(--ob-interaction-fg);\n\t--link-hover:   var(--ob-interaction-hover);\n\t--accent:       var(--ob-interaction-bg);\n\t--accent-hover: var(--ob-interaction-hover);\n\t--accent-fg:    var(--ob-neutral-0);\n\t--focus:        var(--ob-focus-ring);\n\n\t/* Status surfaces (pale fill / border tint / on-colour) — themable.\n\t   surface = bg-contrast_high · border = bg-contrast_medium · on = fg-contrast_high */\n\t--info-surface: var(--ob-info-50);          --info-border: #dbeafe;   --info-on: var(--ob-info-fg);\n\t--success-surface: var(--ob-confirmed-50);  --success-border: #cbfbf8; --success-on: var(--ob-confirmed-fg);\n\t--warning-surface: var(--ob-pending-50);    --warning-border: #fef3c7; --warning-on: var(--ob-pending-fg);\n\t--critical-surface: var(--ob-critical-50);  --critical-border: #fae1e2; --critical-on: var(--ob-critical-fg);\n}\n\n/* === LEGACY PALETTE (Project Starter Kit 15.1.2) =========================== */\n/* The Starter Kit's pre-15 variable set: blue-700 links, slate buttons, green\n   success, 2px button radius. Enable per app with <html data-palette=\"legacy\">\n   (combinable with data-theme=\"dark\", though legacy apps rarely shipped one). */\n[data-palette=\"legacy\"] {\n\t--ob-interaction-fg:        #1d4ed8;  /* blue-700 */\n\t--ob-interaction-hover:     #1e40af;  /* blue-800 */\n\t--ob-interaction-pressed:   #1e3a8a;  /* blue-900 */\n\t--ob-interaction-visited:   #4338ca;\n\t--ob-interaction-bg:        #596978;  /* primary action = slate ($ob-secondary-400) */\n\t--ob-interaction-selected-bg: #dbeafe;\n\t--ob-interaction-focus-bg:  #dbeafe;\n\t--accent-fg: #ffffff;\n\n\t--ob-btn-primary-bg:        #596978;  /* secondary-400 */\n\t--ob-btn-pr n@keyframes obx-halo { 0%, 100% { box-shadow: 0 0 0 0 rgb(186 22 105 / 0.35); } 50% { box-shadow: 0 0 0 8px rgb(186 22 105 / 0); } }\n.obx-animate-in { animation: obx-fade-up 300ms var(--obx-ease-swift) both; }\n.obx-stagger > * { animation: obx-fade-up 350ms var(--obx-ease-swift) both; }\n.obx-stagger > :nth-child(2) { animation-delay: 50ms; } .obx-stagger > :nth-child(3) { animation-delay: 100ms; }\n.obx-stagger > :nth-child(4) { animation-delay: 150ms; } .obx-stagger > :nth-child(5) { animation-delay: 200ms; }\n.obx-stagger > :nth-child(6) { animation-delay: 250ms; } .obx-stagger > :nth-child(7) { animation-delay: 300ms; }\n.obx-stagger > :nth-child(8) { animation-delay: 350ms; }\n@media (prefers-reduced-motion: reduce) {\n\t[class*=\"obx-\"], [class*=\"obx-\"]::before, [class*=\"obx-\"]::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }\n}\n\n/* ------------------------------------------------------------- Grundlagen -- */\n[class*=\"obx-\"] { box-sizing: border-box; }\n.obx-ic { display: inline-block; width: 20px; height: 20px; flex: none; background: currentColor; -webkit-mask-image: var(--icon, none); mask-image: var(--icon, none); -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }\n.obx-divider { height: 1px; background: var(--border-subtle); border: none; margin: 16px 0; }\n.obx-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); font: 500 11px/1 var(--ob-font-mono); color: var(--fg-2); }\n:where(.obx-btn, .obx-icon-btn, .obx-chip, .obx-tab, .obx-nav-item, .obx-page-btn, .obx-search-trigger, .obx-cmdk-item, .obx-check, .obx-radio, .obx-switch input, .obx-input, .obx-select select, .obx-seg button, .obx-composer input):focus Rules }}\">Regelwerk<\u002Fbutton>\n    <\u002Fnav>\n    <div class=\"obx-topbar-actions\" style=\"gap: 10px;\">\n      <span class=\"obx-badge obx-badge-pending\" style=\"flex: none;\">Konzept · Demo<\u002Fspan>\n      <button type=\"button\" class=\"obx-icon-btn\" aria-label=\"Hinweise zur Prüfung\" sc-camel-on-click=\"{{ openHints }}\"><span class=\"obx-ic ic-question\"><\u002Fspan><\u002Fbutton>\n      <span class=\"obx-avatar\" title=\"BIT-Mitarbeitende\">BM<\u002Fspan>\n      <span class=\"user-name\" style=\"font: 500 14px/20px var(--ob-font-body); color: var(--fg-1); white-space: nowrap;\">BIT-Mitarbeitende<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex: 1; width: 100%; max-width: 1600px; margin: 0 auto; padding: 22px 32px 48px; box-sizing: border-box; min-width: 0;\">\n    <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px;\"><div class=\"skel\" style=\"height: 32px; width: 40%;\"><\u002Fdiv><div class=\"skel\" style=\"width: 60%;\"><\u002Fdiv><div class=\"skel\" style=\"height: 37px; margin-top: 10px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Arbeitsbereich\" style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"min-width: 0;\">\n            <h1 class=\"obx-page-title\">Dokumente klassifizieren<\u002Fh1>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"obx-alert obx-alert-info\" role=\"note\" style=\"align-items: center; flex-wrap: wrap; padding: 10px 14px;\">\n          <span class=\"obx-alert-icon\"><\u002Fspan>\n          <span style=\"flex: 1 1 320px; min-width: 0;\">KI-Ergebnisse sind Vorschläge. Die abschliessende Klassifizierung erfolgt durch BI ass=\"obx-tile obx-tile-soft obx-tile-info\"><span class=\"obx-ic ic-cloud-upload\"><\u002Fspan><\u002Fspan>\n              <div style=\"font: 600 15px/22px var(--ob-font-body); color: var(--fg-1); margin-top: 6px;\">Dokumente hier ablegen<\u002Fdiv>\n              <div style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2);\">oder vom Computer auswählen<\u002Fdiv>\n              <button type=\"button\" class=\"obx-btn obx-btn-secondary obx-btn-sm\" style=\"margin-top: 6px;\" sc-camel-on-click=\"{{ pickFileBtn }}\"><span class=\"obx-ic ic-plus\"><\u002Fspan>Dateien auswählen<\u002Fbutton>\n              <div style=\"font: 400 13.5px/19px var(--ob-font-body); color: var(--fg-2); margin-top: 4px;\">PDF, DOCX, XLSX · max. 50 MB / Datei<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"obx-alert obx-alert-critical\" role=\"alert\" style=\"font-size: 13.5px; line-height: 19px;\"><span class=\"obx-alert-icon\"><\u002Fspan><span><b style=\"font-weight: 600;\">{{ errorTitle }}<\u002Fb> {{ errorText }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Faside>\n\n          <section style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\" aria-live=\"polite\">\n            <sc-if value=\"{{ viewEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ viewBusy }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                <div style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\"><span class=\"obx-ic ic-sparkle\" style=\"width: 22px; height: 22px; color: var(--obx-ai-fg);\"><\u002Fspan><h2 style=\"margin: 0; font: 650 20px/28px var(--obx-font-display); letter-spacing: -0.4px; color: var(--fg-1);\">KI-Klassifizierungsvorschläge<\u002Fh2><\u002Fdiv>\n                <span class=\"obx-ai-badge\"><span class=\"obx-ic\"><\u002Fspan>Analyse läuft<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 18px; padding: 22px;\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                  <div style=\"min-width: 0;\"><div style=\"font: 600 16px/24px var(--ob-font-body); color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ selName }}<\u002Fdiv><div style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2);\">{{ selMeta }} · Analyse lokal im BIT-Rechenzentrum<\u002Fdiv><div class=\"obx-thinking-label\" style=\"margin-top: 6px;\"><span class=\"obx-thinking\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>KI analysiert das Dokument …<\u002Fdiv><\u002Fdiv>\n                  <button type=\"button\" class=\"obx-btn obx-btn-secondary obx-btn-sm\" sc-camel-on-click=\"{{ cancelSel }}\">Abbrechen<\u002Fbutton>\n                <\u002Fdiv>\n                <div class=\"obx-ai-bar\"><\u002Fdiv>\n                <ul class=\"obx-plan\" aria-label=\"Analyseschritte\" style=\"gap: 12px;\">\n                  <sc-for list=\"{{ busySteps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                    <li class=\"{{ st.cls }}\"><span class=\"obx-ic\"><\u002Fspan><span style=\"min-width: 0;\">{{ st.label }}<sc-if value=\"{{ st.done }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display: block; font: 400 13.5px/19px var(--ob-font-body); color: var(--fg-2);\">{{ st.detail }}<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ viewReview }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                <div style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\"><span class=\"obx-ic ic-sparkle\" style=\"width: 22px; height: 22px; color: var(--obx-ai-fg);\"><\u002Fspan><h2 style=\"margin: 0; font: 650 20px/28px var(--obx-font-display); letter-spacing: -0.4px; color: var(--fg-1);\">KI-Klassifizierungsvorschläge<\u002Fh2><span style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ selName }}<\u002Fspan><\u002Fdiv>\n                <span class=\"{{ selStatusCls }}\">{{ selStatus }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <section class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 16px;\" aria-labelledby=\"h-isv\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px;\"><h3 id=\"h-isv\" style=\"margin: 0; font: 700 16px/24px var(--ob-font-body); color: var(--fg-1);\">Informationssicherheit (gemäss ISV)<\u002Fh3><\u002Fdiv>\n                  <span class=\"obx-ai-badge\"><span class=\"obx-ic ic-sparkle\"><\u002Fspan>KI-Vorschlag · Konfidenz {{ isvConf }}<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"catbox\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\"><span style=\"font: 600 14px/20px var(--ob-font-body); color: var(--fg-2);\">Mögliche Klassifizierung<\u002Fspan><\u002Fdiv>\n                  <div class=\"tilerow\" style=\"grid-template-columns: repeat(4, minmax(0, 1fr));\">\n                    <sc-for list=\"{{ isvTiles }}\" as=\"tl\" hint-placeholder-count=\"3\">\n                      <button type=\"button\" class=\"{{ tl.cls }}\" aria-pressed=\"{{ tl.selected }}\" disabled=\"{{ tl.disabled }}\" title=\"{{ tl.title }}\"><b>{{ tl.label }}<\u002Fb><span>{{ tl.desc }}<\u002Fspan><small>{{ tl.note }}<\u002Fsmall><sc-if value=\"{{ tl.isAi }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"obx-ai-badge\" style=\"align-self: flex-start; margin-top: 6px;\"><span class=\"obx-ic ic-sparkle\"><\u002Fspan>KI-Vorschlag<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ isvHintLow }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"obx-alert obx-alert-warning\" role=\"note\"><span class=\"obx-alert-icon\"><\u002Fspan><span><b style=\"font-weight: 600;\">Tiefe Konfidenz.<\u002Fb> Die KI ist zwischen zwei Kategorien unsicher – entscheiden Sie anhand der Fundstellen und des Verwendungszwecks.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                <button type=\"button\" class=\"evtoggle\" aria-expanded=\"{{ isvEvOpen }}\" sc-camel-on-click=\"{{ toggleIsvEv }}\"><span class=\"{{ isvEvChevron }}\"><\u002Fspan>Fundstellen<span class=\"obx-badge obx-badge-closed\">{{ isvEvCount }}<\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{ isvEvOpen }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                  <sc-for list=\"{{ isvEvidence }}\" as=\"ev\" hint-placeholder-count=\"2\">\n                    <div class=\"ev\"><div class=\"ev-q\">«{{ ev.quote }}»<\u002Fdiv><div class=\"ev-meta\"><span class=\"mark\">{{ ev.letter }}<\u002Fspan><span>{{ ev.ref }}<\u002Fspan><span style=\"flex: 1;\"><\u002Fspan><button type=\"button\" class=\"obx-btn obx-btn-tertiary obx-btn-sm\" sc-camel-on-click=\"{{ ev.open }}\">Im Dokument anzeigen<span class=\"obx-ic ic-link\"><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv><\u002Fsc-if>\n              <\u002Fsection>\n\n              <section class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 16px;\" aria-labelledby=\"h-dsg\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                  <div style=\"display: flex; align-items: baseline; gap: 10px;\"><h3 id=\"h-dsg\" style=\"margin: 0; font: 700 16px/24px var(--ob-font-body); color: var(--fg-1);\">Datenschutz (gemäss DSG)<\u002Fh3><\u002Fdiv>\n                  <span class=\"obx-ai-badge\"><span class=\"obx-ic ic-sparkle\"><\u002Fspan>KI-Vorschlag · Konfidenz {{ dsgConf }}<\u002Fspan>\n                <\u002Fdiv>\n                \n                  <div class=\"catbox\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\"><span style=\"font: 600 14px/20px var(--ob-font-body); color: var(--fg-2);\">Mögliche Einstufung<\u002Fspan><\u002Fdiv>\n                    <div class=\"tilerow\" style=\"grid-template-columns: repeat(5, minmax(0, 1fr));\">\n                      <sc-for list=\"{{ dsgTiles }}\" as=\"tl\" hint-placeholder-count=\"3\">\n                        <button type=\"button\" class=\"{{ tl.cls }}\" aria-pressed=\"{{ tl.selected }}\"><b>{{ tl.label }}<\u002Fb><span>{{ tl.desc }}<\u002Fspan><sc-if value=\"{{ tl.isAi }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"obx-ai-badge\" style=\"align-self: flex-start; margin-top: 6px;\"><span class=\"obx-ic ic-sparkle\"><\u002Fspan>KI-Vorschlag<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <sc-if value=\"{{ dsgHasEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button type=\"button\" class=\"evtoggle\" aria-expanded=\"{{ dsgEvOpen }}\" sc-camel-on-click=\"{{ toggleDsgEv }}\"><span class=\"{{ dsgEvChevron }}\"><\u002Fspan>Fundstellen<span class=\"obx-badge obx-badge-closed\">{{ dsgEvCount }}<\u002Fspan><\u002Fbutton>\n                  <sc-if value=\"{{ dsgEvOpen }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                    <sc-for list=\"{{ dsgEvidence }}\" as=\"ev\" hint-placeholder-count=\"1\">\n                      <div class=\"ev\"><div class=\"ev-q\">«{{ ev.quote }}»<\u002Fdiv><div class=\"ev-meta\"><span class=\"mark\">{{ ev.letter }}<\u002Fspan><span>{{ ev.ref }}<\u002Fspan><span style=\"flex: 1;\"><\u002Fspan><button type=\"button\" class=\"obx-btn obx-btn-tertiary obx-btn-sm\" sc-camel-on-click=\"{{ ev.open }}\">Im Dokument anzeigen<span class=\"obx-ic ic-link\"><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv><\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fsection>\n\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                <span style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2);\">Prüfergebnis ohne Rechtswirkung – die abschliessende Klassifizierung erfolgt durch BIT-Mitarbeitende.<\u002Fspan>\n                <div style=\"display: flex; gap: 10px; align-items: center;\"><button type=\"button\" class=\"obx-btn obx-btn-secondary\" sc-camel-on-click=\"{{ openJson }}\"><span class=\"obx-ic ic-database\"><\u002Fspan>Befund als JSON<\u002Fbutton><button type=\"button\" class=\"obx-btn obx-btn-primary\" sc-camel-on-click=\"{{ pickFile }}\"><span class=\"obx-ic ic-upload\"><\u002Fspan>Weiteres Dokument hochladen<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display: flex; align-items: flex-start; gap: 8px; font: 400 13.5px/19px var(--ob-font-body); color: var(--fg-2);\"><span class=\"obx-ic ic-info\" style=\"width: 14px; height: 14px; flex: none; margin-top: 1px;\"><\u002Fspan><span>Illustrative Kategorien, keine validierte BIT-Taxonomie oder verbindliche Rechtsbewertung. Eigenständiges UI-Konzept; keine offizielle Corporate-Design-Konformität.<\u002Fspan><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRules }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Regelwerk\" style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n          <div style=\"min-width: 0; max-width: 760px;\">\n            <h1 class=\"obx-page-title\">Regelwerk<\u002Fh1>\n            <p class=\"obx-page-sub\">Grundlage der KI-Vorschläge: Kategorien nach ISV, Einstufungen nach DSG sowie die Regeln für Konfidenz, Begründung und Fundstellen. Änderungen nehmen die Dienstverantwortlichen vor.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"obx-badge obx-badge-resolved\" style=\"margin-top: 10px;\">Version 2026-10 · aktiv<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"obx-card\" style=\"padding: 0; overflow: hidden;\">\n          <div style=\"display: flex; align-items: baseline; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border-subtle);\"><h2 style=\"margin: 0; font: 700 16px/24px var(--ob-font-body);\">ISV<\u002Fh2><span style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2);\">Kategorien nach Informations-Sicherheits-Verordnung<\u002Fspan><\u002Fdiv>\n          <div style=\"overflow-x: auto;\">\n            <sc-raw-table class=\"obx-table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Kategorie<\u002Fsc-raw-th><sc-raw-th>Bedeutung<\u002Fsc-raw-th><sc-raw-th>Grundlage<\u002Fsc-raw-th><sc-raw-th>KI-Vorschlag<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"white-space: nowrap; font-weight: 600;\">nicht klassifiziert<\u002Fsc-raw-td><sc-raw-td>Keine ISV-relevante Information – Zugangsvermutung nach BGÖ, zur Veröffentlichung geeignet<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\">Art. 11 ISG<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\"><span class=\"obx-badge obx-badge-resolved\">Ja · mit Konfidenz<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"white-space: nowrap; font-weight: 600;\">intern<\u002Fsc-raw-td><sc-raw-td>Interner Verwendungskreis – unbefugte Kenntnisnahme bereitet geringe Nachteile<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\">Art. 12 ISG<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\"><span class=\"obx-badge obx-badge-resolved\">Ja · mit Konfidenz<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"white-space: nowrap; font-weight: 600;\">vertraulich<\u002Fsc-raw-td><sc-raw-td>Beschränkter Zugriff – unbefugte Kenntnisnahme kann den Interessen des Bundes oder betroffener Personen erheblichen Schaden zufügen<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\">Art. 13 ISG<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\"><span class=\"obx-badge obx-badge-resolved\">Ja · mit Konfidenz<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"white-space: nowrap; font-weight: 600;\">geheim<\u002Fsc-raw-td><sc-raw-td>Keine automatisierte Beurteilung – Einstufung ausschliesslich manuell durch die zuständige Stelle; die KI schlägt diese Kategorie nie vor<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\">Art. 14 ISG<\u002Fsc-raw-td><sc-raw-td style=\"white-space: nowrap;\"><span class=\"obx-badge obx-badge-closed\">Nein · nur manuell<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; align-items: start;\">\n          <section class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\"><h2 style=\"margin: 0; font: 700 16px/24px var(--ob-font-body);\">DSG<\u002Fh2><span style=\"font: 400 14px/20px var(--ob-font-body); color: var(--fg-2);\">Einstufungen nach Datenschutzgesetz<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; font: 400 14px/21px var(--ob-font-body); color: var(--fg-2);\">\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Keine Personendaten<\u002Fb> – kein Bezug auf bestimmte oder bestimmbare natürliche Personen.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Personendaten<\u002Fb> (Art. 5 lit. a DSG) – Namen, Personalnummern, Adressen, Geburtsdaten, Kontaktangaben.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Besonders schützenswerte Personendaten<\u002Fb> (Art. 5 lit. c DSG) – abschliessende Liste: 1 religiöse, weltanschauliche, politische oder gewerkschaftliche Ansichten · 2 Gesundheit, Intimsphäre, Rasse oder Ethnie · 3 genetische Daten · 4 biometrische Daten · 5 verwaltungs- und strafrechtliche Verfolgungen oder Sanktionen · 6 Massnahmen der sozialen Hilfe.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Profiling<\u002Fb> (Art. 5 lit. f DSG) – automatisierte Bearbeitung von Personendaten, um persönliche Aspekte zu bewerten, etwa Arbeitsleistung, Gesundheit, Verhalten oder Aufenthaltsort.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Profiling mit hohem Risiko<\u002Fb> (Art. 5 lit. g DSG) – Profiling, das durch Verknüpfung von Daten eine Beurteilung wesentlicher Aspekte der Persönlichkeit erlaubt.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\"><h2 style=\"margin: 0; font: 700 16px/24px var(--ob-font-body);\">Konfidenz, Begründung, Fundstellen<\u002Fh2><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; font: 400 14px/21px var(--ob-font-body); color: var(--fg-2);\">\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Konfidenz<\u002Fb> – Wahrscheinlichkeit, die das Modell der vorgeschlagenen Kategorie zuweist; die Verteilung über alle Kategorien wird mitgeliefert. Unter 70 % erscheint der Hinweis «tiefe Konfidenz».<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Begründung<\u002Fb> – in der Dokumentsprache, mit Bezug auf die Rechtsgrundlage und den Verwendungszweck.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Fundstellen<\u002Fb> – Seite, Absatz und Zitat für jede Aussage; markiert mit A, B, C … und im Dokument hervorgehoben.<\u002Fdiv>\n              \n            <\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"obx-card\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\"><h2 style=\"margin: 0; font: 700 16px/24px var(--ob-font-body);\">Modell und Betrieb<\u002Fh2><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; font: 400 14px/21px var(--ob-font-body); color: var(--fg-2);\">\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Modell<\u002Fb> bit-classify-l aus dem internen Modellkatalog · Prompt-Version classify-isv-dsg@2026-10.3 · erzwungenes JSON-Schema.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">PII-Erkennung<\u002Fb> als zweite, unabhängige Quelle für Personendaten und DSG-Kategorien.<\u002Fdiv>\n              <div><b style=\"font-weight: 600; color: var(--fg-1);\">Betrieb<\u002Fb> auf GPU-Knoten im BIT-Rechenzentrum; Dokumente verlassen den Perimeter der Bundesverwaltung nicht.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer class=\"obx-foot\" style=\"flex: none; flex-wrap: wrap;\">\n    <span>© 2026 Bundesamt für Informatik und Telekommunikation BIT<\u002Fspan>\n    <a href=\"#rechtliches\" sc-camel-on-click=\"{{ noop }}\">Rechtliches<\u002Fa>\n    <a href=\"#datenschutz\" sc-camel-on-click=\"{{ noop }}\">Datenschutz<\u002Fa>\n    <a href=\"#impressum\" sc-camel-on-click=\"{{ noop }}\">Impressum<\u002Fa>\n    <a href=\"#barrierefreiheit\" sc-camel-on-click=\"{{ noop }}\">Barrierefreiheit<\u002Fa>\n    <span style=\"margin-left: auto;\">Dokumenten-Classifier · Konzept-Prototyp · Analyse simuliert, Testdaten synthetisch<\u002Fspan>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ anyDialog }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 1300; display: grid; place-items: center; padding: 24px; background: var(--obx-scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); overflow: auto;\" sc-camel-on-click=\"{{ closeDialog }}\">\n      <sc-if value=\"{{ dlgHints }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-hints\" style=\"width: 100%; max-width: 560px; background: var(--surface-raised); border-radius: var(--obx-radius-xl); box-shadow: var(--obx-shadow-xl); overflow: hidden; display: flex; flex-direction: column;\" sc-camel-on-click=\"{{ stop }}\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 0;\"><h2 id=\"dlg-hints\" style=\"margin: 0; font: 600 18px/26px var(--ob-font-body);\">Hinweise zur Prüfung<\u002Fh2><button type=\"button\" class=\"obx-icon-btn\" aria-label=\"Schliessen\" sc-camel-on-click=\"{{ closeDialog }}\"><span class=\"obx-ic ic-xmark\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n          <ol style=\"margin: 14px 0 0; padding: 0 22px 0 42px; display: flex; flex-direction: column; gap: 10px; font: 400 14.5px/22px var(--ob-font-body); color: var(--fg-1);\">\n            <li>KI-Ergebnisse sind Vorschläge ohne Rechtswirkung. Die abschliessende Klassifizierung erfolgt durch BIT-Mitarbeitende.<\u002Fli>\n            <li>Prüfen Sie jede Fundstelle über «Im Dokument anzeigen», um den Vorschlag nachzuvollziehen.<\u002Fli>\n            <li>Bei einer Konfidenz unter 70 % ist das Modell zwischen zwei Kategorien unsicher – entscheiden Sie nach Verwendungszweck des Dokuments.<\u002Fli>\n            <li>«Geheim» wird nie vorgeschlagen. Diese Einstufung erfolgt ausschliesslich manuell durch die zuständige Stelle.<\u002Fli>\n          <\u002Fol>\n          <div style=\"display: flex; justify-content: flex-end; gap: 10px; padding: 18px 22px 22px;\"><button type=\"button\" class=\"obx-btn obx-btn-secondary\" sc-camel-on-click=\"{{ goRulesFromDialog }}\">Regelwerk öffnen<\u002Fbutton><button type=\"button\" class=\"obx-btn obx-btn-primary\" sc-camel-on-click=\"{{ closeDialog }}\">Verstanden<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ dlgDoc }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-doc\" style=\"width: 100%; max-width: 820px; background: var(--surface-raised); border-radius: var(--obx-radius-xl); box-shadow: var(--obx-shadow-xl); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 48px);\" sc-camel-on-click=\"{{ stop }}\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 12px; border-bottom: 1px solid var(--border-subtle);\"><div style=\"min-width: 0;\"><h2 id=\"dlg-doc\" style=\"margin: 0; font: 600 16px/24px var(--ob-font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ selName }}<\u002Fh2><div style=\"font: 400 13.5px/19px var(--ob-font-body); color: var(--fg-2);\">Fun
