  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d2dbdb13-0651-4731-be55-bf419214d473\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>/* ============================================================================\n   Oblique Design System — Colours & Type\n   Swiss Confederation · Federal Office of Information Technology (FOITT)\n   Values mirror the Oblique design tokens (Figma → CSS, 1:1).\n   Source: github.com/oblique-bit/oblique  ·  oblique.bit.admin.ch\n   ============================================================================ */\n\n/* ----------------------------------------------------------------- Fonts -- */\n/* Self-hosted brand faces. The woff2 files ARE Google's Noto Sans (variable, real\n   weight axis 100–900) and Noto Sans Mono — the Oblique design system ships them\n   as its own typeface, aliased here under a project-scoped family name. */\n@font-face {\n\tfont-family: \"Oblique Sans\";\n\tfont-style: normal;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"9749cd95-b8b5-4a68-9c9d-3669ebd27fe4\") format(\"woff2\");\n}\n@font-face {\n\tfont-family: \"Oblique Sans\";\n\tfont-style: italic;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"830c6198-516c-4976-a7e9-2bad7255e7f1\") format(\"woff2\");\n}\n@font-face {\n\tfont-family: \"Oblique Mono\";\n\tfont-style: normal;\n\tfont-weight: 100 900;\n\tfont-display: swap;\n\tsrc: url(\"b728b1b2-0662-4a8e-b691-c276cb30a3ad\") format(\"woff2\");\n}\n\n:root {\n\t/* === RAW OBLIQUE TOKENS (curated subset, light mode / inversity-normal) === */\n\n\t/* — Neutral scale (cool slate-blue greys) — */\n\t--ob-neutral-0:    #ffffff;  /* surface / contrast-highest bg            */\n\t--ob-neutral-50:   #f0f4f7;  /* subtle bg, hover fill (contrast-high)    */\n\t--ob-neutral-100:  #dfe4e9;  /* muted bg, dividers (contrast-medium)     */\n\t--ob-neutral-200:  #acb4bd;  /* borders, disabled (contrast-low)         */\n\t--ob-neutral-300:  #828e9a;  /* placeholder, icons-muted                 */\n\t--ob-neutral-400:  #596978;  /* secondary icon / filled-neutral surface  */\n\t--ob-neutral-500:  #46596b;\n\t--ob-neutral-600:  #2f4356;  /* secondary text (fg contrast-low)         */\n\t--ob-neutral-700:  #263645;  /* strong text (fg contrast-medium)         */\n\t--ob-neutral-800:  #1c2834;  /* primary text (fg contrast-high)          */\n\t--ob-neutral-900:  #131b22;  /* near-black (fg contrast-highest)         */\n\n\t/* — Brand: Swiss federal red — */\n\t/* NB (provenance): the \"Project Starter Kit 15.1.2\" Figma file still carries the LEGACY\n\t   variable set (--blue-700 #1d4ed8 links, slate --secondary-400 #596978 buttons, green\n\t   success). This file follows the RELEASED design-system tokens (15.1.2/15.2.0), which\n\t   define the current steel-blue interaction palette. Legacy set kept for reference in\n\t   scraps/fig-starter-tokens/fig-tokens.css. */\n\t--ob-brand:        #ff0000;  /* the pure-red coat-of-arms / cross         */\n\t--ob-red-700:      #99191e;  /* critical fg / dark federal red            */\n\t--ob-red-600:      #bf1f25;\n\t--ob-red-500:      #d8232a;  /* critical accent (bright)                  */\n\t--ob-red-50:       #ffedee;  /* critical surface                          */\n\t--ob-red-100:      #ffccce;\n\n\t/* — Interaction (links, selection): the Oblique STEEL BLUE.\n\t     Verified 06.2026 against the released design-system tokens (15.1.2 + 15.2.0,\n\t     `--ob-s3-color-interaction-state-*`). NB: the Tailwind blue #1D4ED8 seen in a few\n\t     Figma component fills is the *status-info* palette / a stale fill — NOT the link colour. — */\n\t--ob-interaction-fg:        #2e8fbf;  /* link & enabled/focus fg (s3 fg-enabled)     */\n\t--ob-interaction-hover:     #236487;  /* hover fg                                    */\n\t--ob-interaction-pressed:   #236487;  /* pressed fg (= hover in 15.x)                */\n\t--ob-interaction-visited:   #4338ca;  /* visited link (indigo)                       */\n\t--ob-interaction-bg:        #2379a4;  /* primary-action surface (s3 bg-enabled)      */\n\t--ob-interaction-selected-bg: #aacae6; /* selected surface                           */\n\t--ob-interaction-focus-bg:  #d3dee9;  /* focussed surface                            */\n\t--ob-interaction-disabled-fg: rgb(19 27 34 / 0.4);\n\t--ob-interaction-disabled-bg: rgb(19 27 34 / 0.1);\n\t--ob-focus-ring:            #8b5cf6;  /* 3px solid violet focus outline, 3px offset  */\n\n\t/* — Buttons (`--ob-h-button-*` tokens 15.x): primary = FILLED STEEL BLUE;\n\t     secondary = transparent + 1px border in the link colour; tertiary = bare label.\n\t     Label 500 16px/16px · radius 1px · hover lifts (shadow-xl) · pressed flat. — */\n\t--ob-btn-primary-bg:        #2379a4;  /* s3 interaction bg-enabled (flipped)  */\n\t--ob-btn-primary-hover:     #236487;\n\t--ob-btn-primary-pressed:   #255069;\n\t--ob-btn-primary-fg:        #ffffff;\n\t--ob-btn-outline:           #2e8fbf;  /* secondary border (hover → #236487)   */\n\t--ob-btn-ink:               #2e8fbf;  /* secondary / tertiary label            */\n\t--ob-btn-ink-hover:         #236487;\n\t--ob-btn-ghost-hover:       #ffffff;  /* sec./tert. hover fill — white on the grey canvas */\n\t--ob-btn-disabled-bg:       rgb(19 27 34 / 0.3);  /* primary disabled */\n\t--ob-btn-disabled-fg:       rgb(19 27 34 / 0.4);\n\t--ob-btn-radius:            1px; /* @kind radius */      /* h-button border_radius = radius-sm */\n\n\t/* — Status palette — the 12 Oblique statuses (s3 status tokens, light mode).\n\t     -fg = fg-contrast_high (text) · -500 = fg-contrast_low (accent/icon) · -50 = bg-contrast_high (surface).\n\t     Pale border tint = bg-contrast_medium; strong tint = bg-contrast_low. — */\n\t--ob-info-fg:      #1e3a8a;  --ob-info-500:      #1d4ed8;  --ob-info-50:      #eff6ff; /* blue    */\n\t--ob-confirmed-fg: #11575f;  --ob-confirmed-500: #0d8b96;  --ob-confirmed-50: #f2fdfc; /* TEAL    */\n\t--ob-resolved-fg:  #065f46;  --ob-resolved-500:  #059669;  --ob-resolved-50:  #ecfdf5; /* green   */\n\t--ob-attention-fg: #9a3412;  --ob-attention-500: #ea580c;  --ob-attention-50: #fff7ed; /* orange  */\n\t--ob-pending-fg:   #92400e;  --ob-pending-500:   #d97706;  --ob-pending-50:   #fffbeb; /* amber   */\n\t--ob-critical-fg:  #99191e;  --ob-critical-500:  #d8232a;  --ob-critical-50:  #ffedee; /* red     */\n\t--ob-fatal-fg:     #99191e;  --ob-fatal-500:     #d8232a;  --ob-fatal-50:     #ffedee; /* red (darker ramp on dark) */\n\t--ob-progress-fg:  #3730a3;  --ob-progress-500:  #4f46e5;  --ob-progress-50:  #eef2ff; /* indigo  */\n\t--ob-waiting-fg:   #5b21b6;  --ob-waiting-500:   #7c3aed;  --ob-waiting-50:   #f5f3ff; /* violet  */\n\t--ob-scheduled-fg: #9d174d;  --ob-scheduled-500: #db2777;  --ob-scheduled-50: #fdf2f8; /* pink    */\n\t--ob-closed-fg:    #131b22;  --ob-closed-500:    #263645;  --ob-closed-50:    #f0f4f7; /* neutral */\n\t--ob-disabled-fg:  #131b22;  --ob-disabled-500:  #263645;  --ob-disabled-50:  #f0f4f7; /* neutral */\n\t/* Back-compat aliases (pre-15 naming used in earlier drafts of this kit) */\n\t--ob-success-fg: var(--ob-confirmed-fg); --ob-success-500: var(--ob-confirmed-500); --ob-success-50: var(--ob-confirmed-50);\n\t--ob-warning-fg: var(--ob-pending-fg);   --ob-warning-500: var(--ob-pending-500);   --ob-warning-50: var(--ob-pending-50);\n\n\t/* — Type families — */\n\t--ob-font-body:    \"Oblique Sans\", system-ui, -apple-system, \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n\t--ob-font-heading: var(--ob-font-body);\n\t--ob-font-mono:    \"Oblique Mono\", ui-monospace, sfmono-regular, consolas, \"Liberation Mono\", menlo, monospace;\n\n\t/* — Font sizes (static scale, rem) — */\n\t--ob-size-xs:   0.75rem;    /* 12 */\n\t--ob-size-sm:   0.875rem;   /* 14 */\n\t--ob-size-md:   1rem;       /* 16 — base */\n\t--ob-size-lg:   1.125rem;   /* 18 */\n\t--ob-size-xl:   1.4375rem;  /* 23 */\n\t--ob-size-2xl:  1.75rem;    /* 28 */\n\t--ob-size-3xl:  2.125rem;   /* 34 */\n\t--ob-size-4xl:  2.5rem;     /* 40 */\n\t--ob-size-5xl:  3rem;       /* 48 */\n\n\t/* — Weights — */\n\t--ob-weight-regular: 400;\n\t--ob-weight-medium:  500;\n\t--ob-weight-semibold:600;\n\t--ob-weight-bold:    700;\n\t--ob-weight-extrabold:800;\n\n\t/* — Line heights — */\n\t--ob-lh-xs: 1rem;    --ob-lh-sm: 1.25rem;  --ob-lh-md: 1.5rem;\n\t--ob-lh-lg: 1.75rem; --ob-lh-xl: 2.25rem;  --ob-lh-2xl: 3rem; --ob-lh-3xl: 3.5rem;\n\n\t/* — Letter spacing (typographic tracking; @kind other so it stays out of the spacing scale) — */\n\t--ob-ls-narrower:     -1px;   /* @kind other */\n\t--ob-ls-super-narrow: -1.5px; /* @kind other */\n\t--ob-ls-narrow:       -0.5px; /* @kind other */\n\t--ob-ls-normal:        0;     /* @kind other */\n\t--ob-ls-wide:          0.5px; /* @kind other */\n\n\t/* — Radii (federal design = very sharp corners) — */\n\t--ob-radius-sm: 1px;   /* BUTTONS — h-button-border_radius (= radius-sm)            */\n\t--ob-radius-md: 2px;   /* button focus-ring radius                                   */\n\t--ob-radius-lg: 4px;   /* base radius: inputs, cards, datepicker, alerts             */\n\t--ob-radius-pill: 999px; /* avatars, pills, icon-button focus ring                   */\n\n\t/* — Border widths — */\n\t--ob-border-xs: 1px;  --ob-border-sm: 2px;  --ob-border-md: 3px;  --ob-border-lg: 4px;\n\n\t/* — Spacing scale (px) — */\n\t--ob-space-1: 4px;   --ob-space-2: 8px;   --ob-space-3: 12px;  --ob-space-4: 16px;\n\t--ob-space-5: 20px;  --ob-space-6: 24px;  --ob-space-7: 28px;  --ob-space-8: 32px;\n\t--ob-space-9: 36px;  --ob-space-10: 40px; --ob-space-12: 48px; --ob-space-14: 56px; --ob-space-16: 64px;\n\t/* Named spacing aliases — mirror Oblique's $ob-spacing-* SCSS scale (same px, semantic names) */\n\t--ob-space-xs: 4px;   --ob-space-sm: 8px;       --ob-space-md: 12px;  --ob-space-default: 16px;\n\t--ob-space-lg: 24px;  --ob-space-xl: 32px;      --ob-space-xxl: 48px;\n\n\t/* — Elevation (`--ob-s-shadow-*`): always two layers, NAVY-tinted\n\t     rgb(19 27 34) = #131b22 at 5% + 10% — never pure black. — */\n\t--ob-shadow-sm:      0 1px 2px 0 rgb(19 27 34 / 0.05);\n\t--ob-shadow-md:      0 1px 2px 0 rgb(19 27 34 / 0.05), 0 1px 5px 0 rgb(19 27 34 / 0.1);\n\t--ob-shadow-default: 0 2px 4px -1px rgb(19 27 34 / 0.05), 0 4px 10px -1px rgb(19 27 34 / 0.1);\n\t--ob-shadow-lg:      0 2px 6px -1px rgb(19 27 34 / 0.05), 0 5px 20px -2px rgb(19 27 34 / 0.1);\n\t--ob-shadow-xl:      0 6px 10px -5px rgb(19 27 34 / 0.05), 0 15px 25px -3px rgb(19 27 34 / 0.1);\n\t--ob-shadow-2xl:     1px 10px 70px -8px rgb(19 27 34 / 0.05), 0 10px 20px 0 rgb(19 27 34 / 0.1);\n\t--ob-shadow-nav-active: var(--ob-shadow-2xl);  /* s-shadow-main_nav-active */\n\n\t/* — Motion — authoritative Figma scale (--ob-s-motion-*). Reconciled 06.2026:\n\t   the legacy Angular SCSS used a single 0.6s/0.25s pair; the design-system\n\t   tokens define a 5-step duration scale + four named easings. */\n\t--ob-duration-instant:     0ms;    /* @kind other */\n\t--ob-duration-micro:       100ms;  /* @kind other */ /* links, tiny state changes */\n\t--ob-duration-smooth:      200ms;  /* @kind other */ /* buttons, default control motion */\n\t--ob-duration-comfortable: 300ms;  /* @kind other */\n\t--ob-duration-relaxed:     500ms;  /* @kind other */\n\t--ob-duration: var(--ob-duration-smooth);  /* back-compat alias (was 160ms) — @kind other */\n\t--ob-ease-standard: cubic-bezier(0, 0, 0.2, 1);   /* @kind other */\n\t--ob-ease-entrance: cubic-bezier(0, 0, 0.2, 1);   /* @kind other */\n\t--ob-ease-emphasis: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n\t--ob-ease-exit:     cubic-bezier(0.4, 0, 1, 1);   /* @kind other */\n\t--ob-outline-offset: 3px;          /* focus-ring outline-offset (s-outline_offset-md) — @kind other */\n\n\t/* === LAYOUT & SYSTEM TOKENS (added 06.2026 from the Oblique skill) ======== */\n\n\t/* — Z-index ladder — authoritative Figma scale (--ob-s-z_index-*).\n\t   NB: supersedes the legacy SCSS ladder (0/10/101/200/1005/1010/1020). */\n\t--ob-z-stepper-mobile: 1000;  /* @kind other */\n\t--ob-z-header:         1100;  /* @kind other */\n\t--ob-z-drawer:         1200;  /* @kind other */ /* off-canvas / sidenav */\n\t--ob-z-modal:          1300;  /* @kind other */\n\t--ob-z-notification:   1400;  /* @kind other */\n\t--ob-z-tooltip:        1500;  /* @kind other */\n\n\t/* — Breakpoints — federal grid tiers (xs/sm/md/lg). For reference + JS;\n\t   CSS @media can't read custom properties, so mirror these in media queries. */\n\t--ob-bp-xs: 0px;\n\t--ob-bp-sm: 601px;\n\t--ob-bp-md: 906px;\n\t--ob-bp-lg: 1241px;\n\n\t/* — Layout dimensions — fixed federal-chrome measures. */\n\t--ob-layout-body-width:        248px;  /* main-nav body column            */\n\t--ob-layout-logo-width:        218px;  /* Confederation lockup            */\n\t--ob-layout-logo-height:       53px;\n\t--ob-layout-line-width:        5px;    /* active-nav / accent indicator   */\n\t--ob-control-height:           36px;   /* button & input height           */\n\t--ob-offcanvas-width:          40%;\n\t--ob-offcanvas-width-collapsed: 80%;\n\n\t/* — Environment-banner colours — DEV/REF/TEST/ABN header banner.\n\t   Sourced from the Angular library palette (not in the Figma token set);\n\t   each takes white foreground (--ob-env-fg). */\n\t--ob-env-local: #047857;  /* local   — green  */\n\t--ob-env-dev:   #ca8a04;  /* dev     — yellow */\n\t--ob-env-ref:   #ea580c;  /* ref     — orange */\n\t--ob-env-test:  #46596b;  /* test    — slate  */\n\t--ob-env-abn:   #99191e;  /* abnahme — red    */\n\t--ob-env-fg:    #ffffff;\n\n\t/* === SEMANTIC ALIASES (use these in app code; they flip in dark mode) ==== */\n\t--fg-1: var(--ob-neutral-800);   /* primary body / UI text (fg contrast-high)   */\n\t--fg-2: var(--ob-neutral-600);   /* secondary text (fg contrast-low #2f4356)    */\n\t--fg-3: rgb(19 27 34 / 0.4);     /* muted / placeholder (fg contrast-lowest)    */\n\t--fg-on-dark: var(--ob-neutral-0);\n\n\t--surface:        var(--ob-neutral-0);   /* cards, header, inputs            */\n\t--surface-sunken: var(--ob-neutral-50);  /* app / page background            */\n\t--surface-raised: var(--ob-neutral-0);   /* menus, dialogs, popovers         */\n\t--surface-hover:  var(--ob-neutral-50);  /* row / control hover fill         */\n\n\t--bg:        var(--ob-neutral-0);    /* alias of --surface                 */\n\t--bg-subtle: var(--ob-neutral-50);\n\t--bg-muted:  var(--ob-neutral-100);\n\t--bg-header: var(--ob-neutral-0);    /* white app header                   */\n\t--bg-footer: #263645;                /* footer bar — secondary-700, official master-layout footer fill */\n\n\t--border:        var(--ob-neutral-200);\n\t--border-subtle: var(--ob-neutral-100);\n\t--border-strong: var(--ob-neutral-600);\n\n\t--link:         var(--ob-interaction-fg);\n\t--link-hover:   var(--ob-interaction-hover);\n\t--accent:       var(--ob-interaction-bg);\n\t--accent-hover: var(--ob-interaction-hover);\n\t--accent-fg:    var(--ob-neutral-0);\n\t--focus:        var(--ob-focus-ring);\n\n\t/* Status surfaces (pale fill / border tint / on-colour) — themable.\n\t   surface = bg-contrast_high · border = bg-contrast_medium · on = fg-contrast_high */\n\t--info-surface: var(--ob-info-50);          --info-border: #dbeafe;   --info-on: var(--ob-info-fg);\n\t--success-surface: var(--ob-confirmed-50);  --success-border: #cbfbf8; --success-on: var(--ob-confirmed-fg);\n\t--warning-surface: var(--ob-pending-50);    --warning-border: #fef3c7; --warning-on: var(--ob-pending-fg);\n\t--critical-surface: var(--ob-critical-50);  --critical-border: #fae1e2; --critical-on: var(--ob-critical-fg);\n}\n\n/* === LEGACY PALETTE (Project Starter Kit 15.1.2) =========================== */\n/* The Starter Kit's pre-15 variable set: blue-700 links, slate buttons, green\n   success, 2px button radius. Enable per app with <html data-palette=\"legacy\">\n   (combinable with data-theme=\"dark\", though legacy apps rarely shipped one). */\n[data-palette=\"legacy\"] {\n\t--ob-interaction-fg:        #1d4ed8;  /* blue-700 */\n\t--ob-interaction-hover:     #1e40af;  /* blue-800 */\n\t--ob-interaction-pressed:   #1e3a8a;  /* blue-900 */\n\t--ob-interaction-visited:   #4338ca;\n\t--ob-interaction-bg:        #596978;  /* primary action = slate ($ob-secondary-400) */\n\t--ob-interaction-selected-bg: #dbeafe;\n\t--ob-interaction-focus-bg:  #dbeafe;\n\t--accent-fg: #ffffff;\n\n\t--ob-btn-primary-bg:        #596978;  /* secondary-400 */\n\t--ob-btn-primary-hover:     #46596b;  /* secondary-500 */\n\t--ob-btn-primary-pressed:   #2f4356;  /* secondary-600 */\n\t--ob-btn-primary-fg:        #ffffff;\n\t--ob-btn-outline:           #2f4356;\n\t--ob-btn-ink:               #1c2834;\n\t--ob-btn-ink-hover:         #1c2834;\n\t--ob-btn-ghost-hover:       #f0f4f7;\n\t--ob-btn-disabled-bg:       #acb4bd;\n\t--ob-btn-disabled-fg:       #ffffff;\n\t--ob-btn-radius:            2px;\n\n\t/* legacy success = green (the 15.x \"resolved\" ramp) */\n\t--ob-success-fg: #065f46; --ob-success-500: #059669; --ob-success-50: #ecfdf5;\n\t--ob-confirmed-fg: #065f46; --ob-confirmed-500: #059669; --ob-confirmed-50: #ecfdf5;\n\t--success-surface: #ecfdf5; --success-border: #d1fae5; --success-on: #065f46;\n}\n\n/* === DARK MODE ============================================================= */\n/* Oblique \"lightness dark\" (`.ob-lightness-dark` token scope, exact 15.x values).\n   Toggle with <html data-theme=\"dark\"> (or the class .ob-lightness-dark).       */\n[data-theme=\"dark\"] {\n\t--fg-1: #f0f4f7;                 /* fg contrast-high                  */\n\t--fg-2: #acb4bd;                 /* fg contrast-low                   */\n\t--fg-3: rgb(255 255 255 / 0.4);  /* fg contrast-lowest                */\n\n\t/* In dark mode the CONTENT surface (#1c2834) is darker than the page\n\t   canvas (#263645) — the exact inverse of light mode.                */\n\t--surface:        #1c2834;  /* cards, header, inputs (bg contrast-highest) */\n\t--surface-sunken: #263645;  /* page canvas (bg contrast-high)              */\n\t--surface-raised: #263645;  /* menus, dialogs, popovers                    */\n\t--surface-hover:  #233c4d;  /* row / control hover fill                    */\n\n\t--bg:        #1c2834;\n\t--bg-subtle: #263645;\n\t--bg-muted:  #2f4356;\n\t--bg-header: #1c2834;\n\t--bg-footer: #131b22;\n\n\t--border:        rgb(255 255 255 / 0.2);   /* border-medium  */\n\t--border-subtle: rgb(255 255 255 / 0.1);   /* border-subtle  */\n\t--border-strong: #828e9a;                  /* border-strong  */\n\n\t/* Interaction flips to the light steel-blue ramp */\n\t--ob-interaction-fg:        #6eb8e9;\n\t--ob-interaction-hover:     #d3dee9;\n\t--ob-interaction-pressed:   #d3dee9;\n\t--ob-interaction-visited:   #c7d2fe;\n\t--ob-interaction-bg:        #6eb8e9;\n\t--ob-interaction-selected-bg: #236487;\n\t--ob-interaction-focus-bg:  #255069;\n\t--ob-interaction-disabled-fg: rgb(240 244 247 / 0.4);\n\t--ob-interaction-disabled-bg: rgb(255 255 255 / 0.3);\n\t--ob-focus-ring:            #a78bfa;\n\n\t--link:         #6eb8e9;\n\t--link-hover:   #d3dee9;\n\t--accent:       #6eb8e9;   /* primary action on dark           */\n\t--accent-hover: #aacae6;\n\t--accent-fg:    #233c4d;   /* dark label on the light-blue fill */\n\t--focus:        #a78bfa;\n\n\t/* Buttons on dark (h-button tokens, lightness-dark scope) */\n\t--ob-btn-primary-bg:      #6eb8e9;\n\t--ob-btn-primary-hover:   #aacae6;\n\t--ob-btn-primary-pressed: #d3dee9;\n\t--ob-btn-primary-fg:      #233c4d;\n\t--ob-btn-outline:         #6eb8e9;\n\t--ob-btn-ink:             #6eb8e9;\n\t--ob-btn-ink-hover:       #d3dee9;\n\t--ob-btn-ghost-hover:     #233c4d;\n\t--ob-btn-disabled-bg:     rgb(255 255 255 / 0.3);\n\t--ob-btn-disabled-fg:     rgb(240 244 247 / 0.4);\n\n\t/* Status on dark: solid mid-tone surfaces, pale text (exact s3 values) */\n\t--info-surface: #1e40af;     --info-border: #1e3a8a;   --info-on: #bfdbfe;\n\t--success-surface: #0f6b75;  --success-border: #11575f; --success-on: #98f6f3;\n\t--warning-surface: #b45309;  --warning-border: #92400e; --warning-on: #fed7aa;\n\t--critical-surface: #bf1f25; --critical-border: #99191e; --critical-on: #fae1e2;\n}\n\n/* ----------------------------------------------------- Base element styles -- */\n.ob-typeset {\n\tfont-family: var(--ob-font-body);\n\tfont-size: var(--ob-size-md);\n\tfont-weight: var(--ob-weight-medium);\n\tline-height: var(--ob-lh-md);\n\tcolor: var(--fg-1);\n\t-webkit-font-smoothing: antialiased;\n\ttext-rendering: optimizeLegibility;\n}\n\n/* Headings — Oblique scales the colour DOWN the hierarchy (h1 lighter than h3),\n   and sets remarkably TIGHT line-heights on h2/h3 (h-typography-context tokens):\n   h1 28/36 · h2 23/24 · h3 18/20 · h4–h6 18/24. Margins: top 12px (h1: 0), bottom 8px. */\n.ob-h1, .ob-typeset h1 {\n\tfont-family: var(--ob-font-heading);\n\tfont-size: var(--ob-size-2xl); font-weight: var(--ob-weight-bold);\n\tline-height: var(--ob-lh-xl); letter-spacing: var(--ob-ls-narrow);\n\tcolor: var(--ob-neutral-600); margin: 0 0 var(--ob-space-2);\n}\n.ob-h2, .ob-typeset h2 {\n\tfont-size: var(--ob-size-xl); font-weight: var(--ob-weight-bold);\n\tline-height: var(--ob-lh-md); letter-spacing: var(--ob-ls-narrow);\n\tcolor: var(--ob-neutral-700); margin: var(--ob-space-3) 0 var(--ob-space-2);\n}\n.ob-h3, .ob-typeset h3 {\n\tfont-size: var(--ob-size-lg); font-weight: var(--ob-weight-bold);\n\tline-height: var(--ob-lh-sm); color: var(--ob-neutral-800);\n\tmargin: var(--ob-space-3) 0 var(--ob-space-2);\n}\n.ob-h4, .ob-typeset h4 {\n\tfont-size: var(--ob-size-lg); font-weight: var(--ob-weight-bold);\n\tline-height: var(--ob-lh-md); color: var(--ob-neutral-800);\n\tmargin: var(--ob-space-3) 0 var(--ob-space-2);\n}\n/* On dark, headings keep the lighten-up-the-hierarchy logic (exact fg ramp) */\n[data-theme=\"dark\"] .ob-h1, [data-theme=\"dark\"] .ob-typeset h1 { color: #acb4bd; }\n[data-theme=\"dark\"] .ob-h2, [data-theme=\"dark\"] .ob-typeset h2 { color: #dfe4e9; }\n[data-theme=\"dark\"] .ob-h3, [data-theme=\"dark\"] .ob-typeset h3,\n[data-theme=\"dark\"] .ob-h4, [data-theme=\"dark\"] .ob-typeset h4 { color: #f0f4f7; }\n.ob-lead { font-size: var(--ob-size-md); font-weight: var(--ob-weight-bold); letter-spacing: var(--ob-ls-narrow); }\n/* Paragraphs sit at fg contrast-highest (#131b22) — one step darker than UI text */\n.ob-typeset p { margin: 0 0 var(--ob-space-3); color: var(--ob-neutral-900); }\n[data-theme=\"dark\"] .ob-typeset p { color: #ffffff; }\n.ob-typeset a, .ob-link {\n\tcolor: var(--link); text-decoration: underline; text-underline-offset: 2px;\n}\n.ob-typeset a:hover, .ob-link:hover { color: var(--link-hover); }\n.ob-typeset a:active, .ob-link:active { color: var(--ob-interaction-pressed); }\n.ob-typeset a:visited { color: var(--ob-interaction-visited); }\n\n/* — Prose scale (`.ob-typography-context-prose`, 15.x token scope) ———————————\n   The SECOND official type scale, for text-heavy/website-like pages: headings jump to\n   SemiBold 600 with super-narrow −1.5px tracking, body text grows to 18/28.\n   Opt in per region: <div class=\"ob-typeset ob-typeset-prose\">. App UI keeps the default. */\n.ob-typeset-prose h1, .ob-prose-h1 {\n\tfont-size: 48px; line-height: 56px; font-weight: 600;\n\tletter-spacing: -1.5px; color: var(--ob-neutral-600);\n\tmargin: 0 0 var(--ob-space-3);\n}\n.ob-typeset-prose h2, .ob-prose-h2 {\n\tfont-size: 40px; line-height: 48px; font-weight: 600;\n\tletter-spacing: -1.5px; color: var(--ob-neutral-600);\n\tmargin: var(--ob-space-4) 0 var(--ob-space-3);\n}\n.ob-typeset-prose p, .ob-typeset-prose li {\n\tfont-size: 18px; line-height: 28px;\n}\n.ob-typeset-prose .ob-lead { font-size: 18px; line-height: 28px; }\n[data-theme=\"dark\"] .ob-typeset-prose h1, [data-theme=\"dark\"] .ob-typeset-prose h2 { color: #acb4bd; }\n.ob-small { font-size: var(--ob-size-sm); line-height: var(--ob-lh-sm); }\n.ob-caption { font-size: var(--ob-size-xs); line-height: var(--ob-lh-xs); color: var(--fg-2); }\n.ob-mono { font-family: var(--ob-font-mono); }\n\n/* ------------------------------------------------------------------ Icons -- */\n/* Inline-SVG icons inherit the current text colour (fill=\"currentColor\").     */\n/* Usage: <span class=\"ob-icon\" data-icon=\"search\" data-size=\"20\"><\u002Fspan>      */\n/* then load assets/icons.js (it hydrates [data-icon] into inline <svg>).      */\n.ob-icon {\n\tdisplay: inline-flex; align-items: center; justify-content: center;\n\twidth: 24px; height: 24px; flex: none; line-height: 0; color: inherit;\n}\n.ob-icon svg { display: block; width: 100%; height: 100%; }\n.ob-icon-sm { width: 20px; height: 20px; }\n.ob-icon-lg { width: 32px; height: 32px; }\n<\u002Fstyle>\n<style>/* ============================================================================\n   OBLIQUE NEXT 2 — Core: Tokens, Typografie, Motion, Glas\n   «Duo-Akzent»: Steel Blue bleibt die Bedienfarbe, Himbeer wird die zweite\n   Stimme — ausschliesslich für Assistenz/KI (Panel, Vorschläge, Kennzeichnung,\n   Denk- und Streaming-Zustände, Agent-Protokoll). Bundesrot bleibt dem Wappen\n   vorbehalten. Neu: Display-Schrift Sora für Titel & Kennzahlen, farbige\n   Icon-Kacheln, Marken-Hairline, spürbare Micro-Motion. Präfix: --obx-* / .obx-*\n   ============================================================================ */\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c718f708-64fb-426e-8ec7-9e396f704160\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"af0b99e7-55a2-427f-8063-ce4160863c84\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c718f708-64fb-426e-8ec7-9e396f704160\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"af0b99e7-55a2-427f-8063-ce4160863c84\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c718f708-64fb-426e-8ec7-9e396f704160\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"af0b99e7-55a2-427f-8063-ce4160863c84\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c718f708-64fb-426e-8ec7-9e396f704160\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"af0b99e7-55a2-427f-8063-ce4160863c84\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n\t/* — Display-Schrift (Titel, Kennzahlen, App-Name). Body bleibt Noto Sans. — */\n\t--obx-font-display: \"Sora\", \"Oblique Sans\", system-ui, sans-serif;\n\n\t/* — Geometrie: ruhige, moderne Rundung — */\n\t--obx-radius-xs: 6px; --obx-radius-sm: 8px; --obx-radius-md: 10px;\n\t--obx-radius-lg: 14px; --obx-radius-xl: 20px; --obx-radius-pill: 999px;\n\n\t/* — Elevation: weiche, mehrschichtige, navy-getönte Schatten — */\n\t--obx-shadow-xs: 0 1px 2px rgb(19 27 34 / 0.06);\n\t--obx-shadow-sm: 0 1px 2px rgb(19 27 34 / 0.05), 0 2px 8px -2px rgb(19 27 34 / 0.08);\n\t--obx-shadow-md: 0 2px 4px -2px rgb(19 27 34 / 0.06), 0 6px 16px -4px rgb(19 27 34 / 0.10);\n\t--obx-shadow-lg: 0 4px 8px -4px rgb(19 27 34 / 0.08), 0 12px 32px -8px rgb(19 27 34 / 0.14);\n\t--obx-shadow-xl: 0 8px 16px -8px rgb(19 27 34 / 0.10), 0 24px 56px -12px rgb(19 27 34 / 0.18);\n\n\t/* — Glas & Scrim — */\n\t--obx-glass-bg: rgb(255 255 255 / 0.74);\n\t--obx-glass-bg-strong: rgb(255 255 255 / 0.88);\n\t--obx-glass-blur: 14px;\n\t--obx-scrim: rgb(19 27 34 / 0.45);\n\n\t/* — Interaktions-Tints (Steel Blue) — */\n\t--obx-tint-interaction: rgb(46 143 191 / 0.10);\n\t--obx-tint-interaction-strong: rgb(46 143 191 / 0.16);\n\t--obx-focus-glow: 0 0 0 3px rgb(46 143 191 / 0.18);\n\t--obx-focus-glow-critical: 0 0 0 3px rgb(216 35 42 / 0.15);\n\n\t/* — Himbeer: die KI-Farbe. Nur für Assistenz-Funktionen, nie für normale\n\t     Bedienelemente oder Status. Ramp aus oklch(· 0.2 358) abgeleitet. — */\n\t--obx-ai-50:  #fef1f5;  /* Panel-Fläche, Chip-Hover            */\n\t--obx-ai-100: #ffe7ee;  /* Tint stark                           */\n\t--obx-ai-200: #ffc3d6;  /* Rahmen hell                          */\n\t--obx-ai-300: #fe99bc;  /* Text auf dunkel (dark mode)          */\n\t--obx-ai-400: #fc7ead;  /* Fläche auf dunkel (dark mode)        */\n\t--obx-ai-500: #ce337a;  /* Akzent, Punkt, Icon                  */\n\t--obx-ai-600: #ba1669;  /* Fläche (weisser Text, 6.2:1)         */\n\t--obx-ai-700: #9f0054;  /* Text auf hell                        */\n\t--obx-ai-800: #74003d;\n\t--obx-ai:        var(--obx-ai-600);\n\t--obx-ai-fg:     var(--obx-ai-700);\n\t--obx-ai-on:     #ffffff;\n\t--obx-ai-tint:        rgb(186 22 105 / 0.08);\n\t--obx-ai-tint-strong: rgb(186 22 105 / 0.14);\n\t--obx-ai-border:      rgb(186 22 105 / 0.28);\n\t--obx-ai-glow:        0 0 0 3px rgb(186 22 105 / 0.18);\n\n\t/* — Verläufe — */\n\t--obx-grad-accent: linear-gradient(180deg, #2e8fbf, #2379a4); /* @kind color */\n\t--obx-grad-accent-hover: linear-gradient(180deg, #2a86b3, #236487); /* @kind color */\n\t--obx-grad-danger: linear-gradient(180deg, #d8232a, #bf1f25); /* @kind color */\n\t--obx-grad-danger-hover: linear-gradient(180deg, #bf1f25, #99191e); /* @kind color */\n\t--obx-grad-hero: linear-gradient(135deg, #255069, #2379a4 55%, #2e8fbf); /* @kind color */\n\t--obx-grad-surface: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface-sunken) 55%, var(--surface))); /* @kind color */\n\t--obx-grad-ai: linear-gradient(135deg, #ba1669, #2e8fbf); /* @kind color */  /* KI-Signatur: Himbeer → Steel Blue */\n\t--obx-grad-ai-soft: linear-gradient(180deg, rgb(186 22 105 / 0.07), transparent 60%); /* @kind color */\n\t--obx-grad-brandline: linear-gradient(90deg, #2e8fbf, #ba1669); /* @kind color */  /* 3px Hairline über der Topbar */\n\n\t/* — Motion: spürbar, aber funktional — */\n\t--obx-ease-swift: cubic-bezier(0.2, 0.8, 0.2, 1); /* @kind other */\n\t--obx-ease-spring: cubic-bezier(0.34, 1.4, 0.4, 1); /* @kind other */\n\t--obx-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n\t/* — Masse — */\n\t--obx-control-h: 40px; --obx-control-h-sm: 32px; --obx-control-h-lg: 48px;\n\t--obx-topbar-h: 64px; --obx-sidebar-w: 264px; --obx-sidebar-w-collapsed: 76px;\n\t--obx-tile: 36px;\n}\n[data-theme=\"dark\"] {\n\t--obx-shadow-xs: 0 1px 2px rgb(0 0 0 / 0.25);\n\t--obx-shadow-sm: 0 1px 2px rgb(0 0 0 / 0.2), 0 2px 8px -2px rgb(0 0 0 / 0.3);\n\t--obx-shadow-md: 0 2px 4px -2px rgb(0 0 0 / 0.25), 0 6px 16px -4px rgb(0 0 0 / 0.35);\n\t--obx-shadow-lg: 0 4px 8px -4px rgb(0 0 0 / 0.3), 0 12px 32px -8px rgb(0 0 0 / 0.45);\n\t--obx-shadow-xl: 0 8px 16px -8px rgb(0 0 0 / 0.35), 0 24px 56px -12px rgb(0 0 0 / 0.55);\n\t--obx-glass-bg: rgb(28 40 52 / 0.7);\n\t--obx-glass-bg-strong: rgb(28 40 52 / 0.9);\n\t--obx-scrim: rgb(0 0 0 / 0.55);\n\t--obx-tint-interaction: rgb(110 184 233 / 0.14);\n\t--obx-tint-interaction-strong: rgb(110 184 233 / 0.22);\n\t--obx-focus-glow: 0 0 0 3px rgb(110 184 233 / 0.25);\n\t--obx-grad-accent: linear-gradient(180deg, #8ac6ee, #6eb8e9); /* @kind color */\n\t--obx-grad-accent-hover: linear-gradient(180deg, #aacae6, #8ac6ee); /* @kind color */\n\t--obx-grad-hero: linear-gradient(135deg, #131b22, #255069 60%, #2379a4); /* @kind color */\n\t/* Himbeer auf dunkel: hellere Fläche mit dunkler Schrift, Text wird rosé */\n\t--obx-ai:        var(--obx-ai-400);\n\t--obx-ai-fg:     var(--obx-ai-300);\n\t--obx-ai-on:     #2a0a1a;\n\t--obx-ai-tint:        rgb(252 126 173 / 0.12);\n\t--obx-ai-tint-strong: rgb(252 126 173 / 0.2);\n\t--obx-ai-border:      rgb(252 126 173 / 0.35);\n\t--obx-ai-glow:        0 0 0 3px rgb(252 126 173 / 0.25);\n\t--obx-grad-ai: linear-gradient(135deg, #fc7ead, #6eb8e9); /* @kind color */\n\t--obx-grad-ai-soft: linear-gradient(180deg, rgb(252 126 173 / 0.1), transparent 60%); /* @kind color */\n\t--obx-grad-brandline: linear-gradient(90deg, #6eb8e9, #fc7ead); /* @kind color */\n}\n\n/* ------------------------------------------------------------ Typografie -- */\n/* Body: Noto Sans (\"Oblique Sans\"), 450/1.6, eine Tinte. Titel, Kennzahlen und\n   der App-Name wechseln in die Display-Schrift Sora — geometrisch, freundlich. */\n.obx-typeset { font-family: var(--ob-font-body); font-size: 16px; font-weight: 450; line-height: 1.6; color: var(--fg-1); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n.obx-typeset :where(h1), .obx-h1 { font-family: var(--obx-font-display); font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.6px; color: var(--fg-1); margin: 0 0 8px; }\n.obx-typeset :where(h2), .obx-h2 { font-family: var(--obx-font-display); font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.3px; color: var(--fg-1); margin: 20px 0 8px; }\n.obx-typeset :where(h3), .obx-h3 { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--fg-1); margin: 16px 0 6px; }\n.obx-typeset :where(h4), .obx-h4 { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--fg-1); margin: 14px 0 6px; }\n.obx-display { font-family: var(--obx-font-display); font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -1.2px; color: var(--fg-1); }\n.obx-typeset :where(p) { margin: 0 0 12px; }\n.obx-lead { font-size: 18px; line-height: 28px; font-weight: 450; color: var(--fg-2); }\n.obx-small { font-size: 14px; line-height: 20px; }\n.obx-caption { font-size: 12.5px; line-height: 17px; font-weight: 500; color: var(--fg-2); }\n.obx-overline { font-size: 11.5px; line-height: 15px; font-weight: 650; letter-spacing: 0.8px; text-transform: uppercase; color: var(--fg-3); }\n.obx-typeset :where(a), .obx-link { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color 150ms var(--obx-ease-swift); }\n.obx-typeset :where(a):hover, .obx-link:hover { color: var(--link-hover); text-decoration-thickness: 2px; }\n.obx-typeset :where(a):visited { color: var(--ob-interaction-visited); }\n\n/* ------------------------------------------------------------------- Glas -- */\n.obx-glass { background: var(--obx-glass-bg); -webkit-backdrop-filter: blur(var(--obx-glass-blur)) saturate(1.4); backdrop-filter: blur(var(--obx-glass-blur)) saturate(1.4); }\n\n/* ----------------------------------------------------------------- Motion -- */\n@keyframes obx-fade { from { opacity: 0; } }\n@keyframes obx-fade-up { from { opacity: 0; transform: translateY(8px); } }\n@keyframes obx-scale-in { from { opacity: 0; transform: scale(0.96); } }\n@keyframes obx-pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }\n@keyframes obx-toast-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } }\n@keyframes obx-shimmer { to { translate: 100% 0; } }\n@keyframes obx-spin { to { transform: rotate(1turn); } }\n@keyframes obx-breathe { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }\n@keyframes obx-caret { 50% { opacity: 0; } }\n@keyframes obx-indeterminate { 0% { left: -40%; width: 40%; } 60% { width: 55%; } 100% { left: 100%; width: 40%; } }\n@keyframes obx-halo { 0%, 100% { box-shadow: 0 0 0 0 rgb(186 22 105 / 0.35); } 50% { box-shadow: 0 0 0 8px rgb(186 22 105 / 0); } }\n.obx-animate-in { animation: obx-fade-up 300ms var(--obx-ease-swift) both; }\n.obx-stagger > * { animation: obx-fade-up 350ms var(--obx-ease-swift) both; }\n.obx-stagger > :nth-child(2) { animation-delay: 50ms; } .obx-stagger > :nth-child(3) { animation-delay: 100ms; }\n.obx-stagger > :nth-child(4) { animation-delay: 150ms; } .obx-stagger > :nth-child(5) { animation-delay: 200ms; }\n.obx-stagger > :nth-child(6) { animation-delay: 250ms; } .obx-stagger > :nth-child(7) { animation-delay: 300ms; }\n.obx-stagger > :nth-child(8) { animation-delay: 350ms; }\n@media (prefers-reduced-motion: reduce) {\n\t[class*=\"obx-\"], [class*=\"obx-\"]::before, [class*=\"obx-\"]::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }\n}\n\n/* ------------------------------------------------------------- Grundlagen -- */\n[class*=\"obx-\"] { box-sizing: border-box; }\n.obx-ic { display: inline-block; width: 20px; height: 20px; flex: none; background: currentColor; -webkit-mask-image: var(--icon, none); mask-image: var(--icon, none); -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }\n.obx-divider { height: 1px; background: var(--border-subtle); border: none; margin: 16px 0; }\n.obx-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); font: 500 11px/1 var(--ob-font-mono); color: var(--fg-2); }\n:where(.obx-btn, .obx-icon-btn, .obx-chip, .obx-tab, .obx-nav-item, .obx-page-btn, .obx-search-trigger, .obx-cmdk-item, .obx-check, .obx-radio, .obx-switch input, .obx-input, .obx-select select, .obx-seg button, .obx-composer input):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n<\u002Fstyle>\n<style>/* ============================================================================\n   OBLIQUE NEXT 2 — Komponenten-Layer (.obx-*) · «Duo-Akzent»\n   Klassenbasiert, damit React-, Angular-, Web-Component- und Plain-HTML-\n   Consumer dieselbe Optik teilen. Icon-Masken referenzieren assets/icons/\n   relativ zu DIESER Datei (funktioniert aus jeder Seitentiefe).\n   ============================================================================ */\n\n/* ---------------------------------------------------------------- Buttons -- */\n.obx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; flex-shrink: 0; height: var(--obx-control-h); padding: 0 18px; border: 1px solid transparent; border-radius: var(--obx-radius-md); font: 500 15px/1 var(--ob-font-body); letter-spacing: 0.1px; color: var(--fg-1); background: transparent; cursor: pointer; transition: background-color 200ms var(--obx-ease-swift), color 200ms, border-color 200ms, box-shadow 200ms var(--obx-ease-swift), transform 200ms var(--obx-ease-swift); }\n.obx-btn:active:not(:disabled) { transform: scale(0.98); }\n.obx-btn:disabled { cursor: not-allowed; opacity: 0.45; }\n.obx-btn-primary { background: var(--obx-grad-accent) no-repeat, var(--accent); color: var(--accent-fg); box-shadow: var(--obx-shadow-xs); }\n.obx-btn-primary:hover:not(:disabled) { background: var(--obx-grad-accent-hover) no-repeat, var(--accent-hover); box-shadow: var(--obx-shadow-md); transform: translateY(-1px); }\n.obx-btn-primary:active:not(:disabled) { background: var(--ob-btn-primary-pressed); box-shadow: var(--obx-shadow-xs); transform: scale(0.98); }\n.obx-btn-secondary { border-color: var(--ob-btn-outline); color: var(--ob-btn-ink); background: var(--surface); }\n.obx-btn-secondary:hover:not(:disabled) { background: var(--obx-tint-interaction); border-color: var(--ob-btn-ink-hover); color: var(--ob-btn-ink-hover); box-shadow: var(--obx-shadow-sm); transform: translateY(-1px); }\n.obx-btn-tertiary { color: var(--ob-btn-ink); }\n.obx-btn-tertiary:hover:not(:disabled) { background: var(--obx-tint-interaction); color: var(--ob-btn-ink-hover); }\n.obx-btn-danger { background: var(--obx-grad-danger) no-repeat, #d8232a; color: #fff; box-shadow: var(--obx-shadow-xs); }\n.obx-btn-danger:hover:not(:disabled) { background: var(--obx-grad-danger-hover) no-repeat, #bf1f25; box-shadow: var(--obx-shadow-md); transform: translateY(-1px); }\n.obx-btn-ai { background: var(--obx-grad-ai) no-repeat, var(--obx-ai); color: var(--obx-ai-on); box-shadow: var(--obx-shadow-xs); }\n.obx-btn-ai:hover:not(:disabled) { box-shadow: var(--obx-shadow-md), var(--obx-ai-glow); transform: translateY(-1px); filter: saturate(1.1); }\n.obx-btn-ai-soft { background: var(--obx-ai-tint); color: var(--obx-ai-fg); border-color: var(--obx-ai-border); }\n.obx-btn-ai-soft:hover:not(:disabled) { background: var(--obx-ai-tint-strong); }\n.obx-btn-sm { height: var(--obx-control-h-sm); padding: 0 12px; font-size: 14px; border-radius: var(--obx-radius-sm); gap: 6px; }\n.obx-btn-lg { height: var(--obx-control-h-lg); padding: 0 24px; font-size: 16px; border-radius: 10px; }\n.obx-btn.is-icononly { width: var(--obx-control-h); padding: 0; }\n.obx-btn-sm.is-icononly { width: var(--obx-control-h-sm); }\n.obx-btn.is-loading { pointer-events: none; }\n.obx-btn.is-loading::before { content: \"\"; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: obx-spin 700ms linear infinite; }\n.obx-btn .obx-ic { width: 18px; height: 18px; }\n\n/* ------------------------------------------------------------- Icon-Button -- */\n.obx-icon-btn { width: 38px; height: 38px; border-radius: var(--obx-radius-md); display: inline-grid; place-items: center; border: none; background: transparent; color: var(--fg-2); cursor: pointer; position: relative; transition: background 150ms, color 150ms; }\n.obx-icon-btn:hover { background: var(--bg-subtle); color: var(--fg-1); }\n.obx-icon-btn .obx-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--ob-critical-500); border: 2px solid var(--surface); }\n\n/* ------------------------------------------------------------- Formulare -- */\n.obx-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }\n.obx-label { font: 600 14px/20px var(--ob-font-body); color: var(--fg-1); }\n.obx-req { color: var(--ob-critical-500); }\n.obx-input { height: var(--obx-control-h); padding: 0 14px; border: 1px solid var(--border); border-radius: var(--obx-radius-md); background: var(--surface); color: var(--fg-1); font: 450 15px/1.4 var(--ob-font-body); width: 100%; transition: border-color 150ms, box-shadow 150ms; }\n.obx-input::placeholder { color: var(--fg-3); }\n.obx-input:hover:not(:disabled) { border-color: var(--ob-neutral-300); }\n.obx-input:focus { outline: none; border-color: var(--ob-interaction-fg); box-shadow: var(--obx-focus-glow); }\n.obx-input:disabled { background: var(--bg-subtle); color: var(--fg-3); cursor: not-allowed; }\n.obx-input.is-invalid, .is-invalid .obx-input { border-color: var(--ob-critical-500); }\n.obx-input.is-invalid:focus, .is-invalid .obx-input:focus { box-shadow: var(--obx-focus-glow-critical); }\ntextarea.obx-input { height: auto; min-height: 96px; padding: 10px 14px; resize: vertical; }\n.obx-help { font: 450 13px/18px var(--ob-font-body); color: var(--fg-2); }\n.obx-error-text { display: flex; align-items: center; gap: 6px; font: 500 13px/18px var(--ob-font-body); color: var(--ob-critical-500); }\n.obx-select { position: relative; display: block; }\n.obx-select select { appearance: none; width: 100%; height: var(--obx-control-h); padding: 0 40px 0 14px; border: 1px solid var(--border); border-radius: var(--obx-radius-md); background: var(--surface); color: var(--fg-1); font: 450 15px/1.4 var(--ob-font-body); cursor: pointer; transition: border-color 150ms, box-shadow 150ms; }\n.obx-select select:hover { border-color: var(--ob-neutral-300); }\n.obx-select select:focus { outline: none; border-color: var(--ob-interaction-fg); box-shadow: var(--obx-focus-glow); }\n.obx-select::after { content: \"\"; position: absolute; right: 12px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; background: var(--fg-2); -webkit-mask: url(\"92dfbcf9-79c7-4d49-b5da-df2ee62471ad\") center / contain no-repeat; mask: url(\"92dfbcf9-79c7-4d49-b5da-df2ee62471ad\") center / contain no-repeat; pointer-events: none; }\n.obx-choice { display: flex; gap: 10px; align-items: flex-start; font: 450 15px/22px var(--o
