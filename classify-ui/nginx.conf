server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# SPA fallback: unknown routes serve the app shell
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Classify Service: same-origin reverse proxy for the production build (apiBaseUrl is empty)
	location /v1/ {
		proxy_pass http://classify-service:8000;
	}

	location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}
}
