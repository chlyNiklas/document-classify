server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# SPA fallback: unknown routes serve the app shell
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Runtime-mounted OIDC settings must never be cached across deployments.
	location = /assets/auth-config.json {
		add_header Cache-Control "no-store";
		try_files $uri =404;
	}

	location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}
}
