<ob-master-layout
	[navigation]="[{url: 'work', label: 'koby.chrome.navigation.work'}]"
>
	<ng-container obHeaderTitle>
		{{ 'koby.chrome.title' | translate }}
		<span class="app__header-note">{{ 'koby.chrome.header-note' | translate }}</span>
	</ng-container>
	<ng-container obFooterInfo>
		<p>&copy; {{ year() }} {{ 'koby.chrome.footer.owner' | translate }}</p>
	</ng-container>

	<!-- Shared off-canvas sidebar content (guidance, findings JSON). -->
	<ng-container obOffCanvasTitle>{{ offCanvasTitle() | translate }}</ng-container>
	<ng-container obOffCanvasContent>
		@if (offCanvasState.content()) {
			<app-demo-off-canvas />
		}
	</ng-container>
</ob-master-layout>
