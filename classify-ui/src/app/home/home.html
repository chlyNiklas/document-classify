<ob-drop-zone
	[accept]="['.pdf', '.docx', '.txt']"
	[maxFileAmount]="1"
	[multiple]="false"
	(uploadEvent)="onUploadEvent($event)"
/>

@if (pending()) {
	<p class="classify-pending">{{ 'koby.classify.pending' | translate }}</p>
}

@if (result(); as result) {
	<section class="classify-card" [class.classify-card--error]="!result.ok">
		<h2 class="classify-card__title">
			{{ (result.ok ? 'koby.classify.result' : 'koby.classify.error') | translate }}
		</h2>
		@if (!result.ok) {
			<p class="classify-card__status">HTTP {{ result.status }}</p>
		}
		<pre class="classify-card__body">{{ result.body }}</pre>
	</section>
}
