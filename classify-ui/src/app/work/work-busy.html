<section class="card work-busy" data-testid="busy-state">
	<ob-spinner [channel]="spinnerChannel" [fixed]="true" />
	<p class="work-busy__label" data-testid="busy-label">{{ 'koby.work.busy.analysing' | translate }}</p>
	<button type="button" mat-button obButton="secondary" (click)="cancelCurrent()">
		{{ 'koby.work.cancel.label' | translate }}
	</button>
</section>
