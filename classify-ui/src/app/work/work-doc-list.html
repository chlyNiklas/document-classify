@if (rows().length > 0) {
	<table data-testid="doc-list" mat-table class="ob-table" [dataSource]="rows()">
		<ng-container matColumnDef="filename">
			<th *matHeaderCellDef mat-header-cell scope="col">{{ 'koby.work.doclist.column.filename' | translate }}</th>
			<td *matCellDef="let row" mat-cell>
				<button type="button" class="doclist__select" (click)="select(row.id)">
					<span class="doclist__name">{{ row.name }}</span>
					<span class="doclist__meta">{{ row.meta }}</span>
				</button>
			</td>
		</ng-container>

		<ng-container matColumnDef="status">
			<th *matHeaderCellDef mat-header-cell scope="col">{{ 'koby.work.doclist.column.status' | translate }}</th>
			<td
				*matCellDef="let row"
				mat-cell
				class="doclist__status"
				[class.doclist__status--busy]="row.busy"
				[class.doclist__status--done]="!row.busy"
			>
				{{ row.statusLabel | translate }}
			</td>
		</ng-container>

		<ng-container matColumnDef="actions">
			<th *matHeaderCellDef mat-header-cell scope="col">{{ 'koby.work.doclist.column.actions' | translate }}</th>
			<td *matCellDef="let row" mat-cell>
				<div class="doclist__actions">
					<button
						type="button"
						mat-icon-button
						obButton="secondary"
						data-testid="doc-view"
						[disabled]="row.selected"
						[matTooltip]="'koby.work.evidence.show' | translate"
						(click)="select(row.id)"
					>
						<mat-icon svgIcon="eye" />
					</button>
					@if (row.busy) {
						<button
							type="button"
							mat-icon-button
							obButton="secondary"
							data-testid="doc-cancel"
							[matTooltip]="'koby.work.cancel.title' | translate"
							(click)="cancel(row.id)"
						>
							<mat-icon svgIcon="delete" />
						</button>
					}
				</div>
			</td>
		</ng-container>

		<tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
		<tr *matRowDef="let row; columns: displayedColumns" mat-row class="doclist__row" [class.doclist__row--selected]="row.selected"></tr>
	</table>
} @else {
	<p class="doclist__empty">{{ 'koby.work.empty' | translate }}</p>
}
