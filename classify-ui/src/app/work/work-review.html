<section class="work-review" data-testid="review-area">
	<div class="work-review__header">
		<h2>{{ 'koby.work.review.title' | translate }}</h2>
		<span class="work-review__document">{{ document().name }}</span>
		<mat-chip-set>
			<mat-chip class="success">{{ 'koby.work.status.pending' | translate }}</mat-chip>
		</mat-chip-set>
		<button type="button" mat-button obButton="secondary" data-testid="json-finding-action" (click)="openJson()">
			{{ 'koby.work.json.action' | translate }}
		</button>
	</div>

	<div class="work-review__tabs" data-testid="assessment-tabs">
		<mat-tab-group
			mat-stretch-tabs="false"
			preserveContent
			animationDuration="200ms"
			[aria-label]="'koby.work.review.title' | translate"
		>
			<mat-tab>
				<ng-template mat-tab-label>
					<span data-testid="isg-tab">{{ 'koby.work.isg.tab' | translate }}</span>
				</ng-template>
				<div class="work-review__tab-panel">
					<app-review-isg [result]="document().result" />
				</div>
			</mat-tab>
			<mat-tab>
				<ng-template mat-tab-label>
					<span data-testid="dsg-tab">{{ 'koby.work.dsg.tab' | translate }}</span>
				</ng-template>
				<div class="work-review__tab-panel">
					<app-review-dsg [result]="document().result" />
				</div>
			</mat-tab>
		</mat-tab-group>
	</div>

	<footer class="work-review__footer">
		<p class="work-review__disclaimer">
			{{ 'koby.work.disclaimer' | translate }}
		</p>
		<div class="work-review__actions">
			<button type="button" mat-button obButton="primary" data-testid="upload-more-action" (click)="addMoreDocument()">
				{{ 'koby.work.upload-more' | translate }}
			</button>
		</div>
		<input
			#moreFilesInput
			type="file"
			data-testid="upload-more-input"
			hidden
			multiple
			(change)="readMoreFiles($event)"
		/>
	</footer>
</section>
