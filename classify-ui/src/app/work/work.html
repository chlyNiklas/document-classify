<section class="work" data-testid="work-page">
	<div class="work__columns">
		<div class="work__intake-column">
			<ob-alert type="info" class="work__guidance-alert">
				<strong>{{ 'koby.work.guidance-alert.title' | translate }}:</strong>
				{{ 'koby.work.guidance-alert.text' | translate }}
			</ob-alert>

			<app-work-intake class="work__intake" (canceled)="cancel($event)" />
		</div>

		@if (pendingDocument(); as document) {
			<app-work-review class="work__review" [document]="document" />
		}
	</div>
</section>
