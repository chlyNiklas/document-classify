name: document-classify

services:
  classify-service:
    build: ./classify-service
    container_name: classify-service
    ports:
      - "8000:8000"
    env_file:
      - ./classify-service/.env
    environment:
      KOBY_CLASSIFY_cors_origins: http://localhost:4200
      # OpenCode Go provider example (KOBY remains the default):
      # LLM_PROVIDER: opencode
      # OPENCODE_API_KEY: <your-opencode-api-key>
      # OPENCODE_MODEL: glm-5.3-flash
      # OPENCODE_REASONING_EFFORT: low
    restart: unless-stopped

  classify-ui:
    build: ./classify-ui
    container_name: classify-ui
    ports:
      - "4200:80"
    depends_on:
      - classify-service
    restart: unless-stopped
