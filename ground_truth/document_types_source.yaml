schema_version: '1.0'
dataset:
  id: koby-ground-truth
  title: Dokumenttypen für synthetische ISG/ISV- und DSG-Testfälle
  status: draft
  target_documents: 100
  purpose: Planungsgrundlage für die Generierung und fachliche Validierung synthetischer Testdokumente.
    Dokumenttypen und technische Dateiformate sind getrennte Achsen. Diese Datei enthält ausdrücklich
    keine verbindlichen rechtlichen Soll-Einstufungen.
  classification_frameworks:
  - ISG
  - ISV
  - DSG
  classification_catalogues:
  - id: BIT
    status: pending_import
  - id: BV
    status: pending_import
  supported_formats_note: 'Aktueller Umfang: Word (DOCX), PDF (durchsuchbar oder Scan), Plain Text (TXT).
    PowerPoint und Excel sind zurückgestellt.'
file_formats:
- id: pdf_text
  extension: .pdf
  description: Durchsuchbares PDF
  extraction_tests:
  - text
  - tables
  - headers_footers
  - annotations
  - metadata
- id: pdf_scan
  extension: .pdf
  description: Gescanntes PDF
  extraction_tests:
  - ocr
  - image_only_pages
  - recognition_errors
- id: docx
  extension: .docx
  description: Word-Dokument
  extraction_tests:
  - paragraphs
  - tables
  - headers_footers
  - comments
  - tracked_changes
  - metadata
- id: txt
  extension: .txt
  description: Reiner Text
  extraction_tests:
  - encoding
  - plain_text
review_splits:
  development: 50
  validation: 25
  blind_test: 25
  assignment_rule: Inhaltliche Varianten desselben Basisszenarios müssen demselben Split angehören, damit
    kein Informationsleck zwischen Entwicklung und Blindtest entsteht.
