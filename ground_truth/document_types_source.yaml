annotation_policy:
  legal_outcomes_are_not_derived_from_document_type: true
  ground_truth_must_be_manually_validated: true
  distinguish_not_present_from_not_assessable: true
  keep_fact_findings_separate_from_legal_assessment: true
  every_positive_finding_requires_evidence_location: true
  classification_catalogue_entries_require_source_and_version: true
  use_only_synthetic_persons_and_organisations: true
